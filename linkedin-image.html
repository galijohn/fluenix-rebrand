<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fluenix rebrand — LinkedIn image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#f0f0f0;min-height:100%;font-family:'Figtree',sans-serif}
  body{padding:32px 0;display:flex;flex-direction:column;align-items:center;gap:22px}
  .toolbar{
    max-width:1200px;width:calc(100% - 40px);
    background:#fff;border:1px solid #e5e5e5;border-radius:12px;
    padding:18px 22px;display:flex;justify-content:space-between;align-items:center;
    color:#2B2D2F;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.04);
  }
  .toolbar strong{font-weight:700}
  .toolbar-btn{
    background:#00A896;color:#fff;border:none;
    padding:10px 20px;border-radius:10px;
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  }
  .toolbar-btn:hover{background:#008678}

  /* The actual export image — 1200x627 (LinkedIn optimal) */
  .card{
    width:1200px;height:627px;
    background:linear-gradient(135deg,#FFFFFF 0%,#E5F6F4 100%);
    display:flex;flex-direction:column;justify-content:space-between;
    padding:70px 90px;
    box-shadow:0 12px 40px rgba(0,0,0,.08);
    position:relative;overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;
    right:-140px;bottom:-140px;
    width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle,#00A896 0%,transparent 65%);
    opacity:.14;
  }

  .card-top{
    display:inline-flex;align-items:center;gap:10px;
    background:#fff;padding:8px 16px;border-radius:20px;
    align-self:flex-start;
    border:1px solid #D0EEE9;
    font-size:13px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:#007368;
  }
  .card-top .dot{width:8px;height:8px;background:#00A896;border-radius:50%;display:inline-block}

  .card-body{
    display:flex;flex-direction:column;gap:40px;
    align-items:center;text-align:center;
    padding:0 40px;
  }
  .logo-row{
    display:flex;align-items:center;gap:56px;
    justify-content:center;
  }
  .logo-row img.old{
    height:72px;width:auto;opacity:.4;filter:grayscale(.5);
  }
  .logo-row .arrow{
    font-size:64px;font-weight:700;color:#00A896;line-height:1;
  }
  .logo-row img.new{
    height:96px;width:auto;
  }
  .headline{
    font-size:44px;font-weight:700;color:#2B2D2F;
    line-height:1.15;letter-spacing:-.01em;
    max-width:900px;
  }
  .headline .accent{color:#00A896}

  .card-bottom{
    display:flex;justify-content:space-between;align-items:center;
    padding-top:24px;border-top:1px solid rgba(43,45,47,.08);
    font-size:15px;color:#4C4E50;
  }
  .card-bottom .stats{display:flex;gap:32px}
  .card-bottom .stat strong{
    color:#2B2D2F;font-weight:700;display:block;font-size:22px;line-height:1.1;
  }
  .card-bottom .stat span{font-size:13px;color:#808182}
  .card-bottom .site{
    color:#007368;font-weight:600;
  }
</style>
</head>
<body>

<div class="toolbar">
  <div><strong>LinkedIn image · 1200 × 627 px</strong> — right-click the card below → <em>Save image as…</em> or use a screenshot tool for pixel-perfect export.</div>
  <button class="toolbar-btn" onclick="window.print()">Print / Save as PDF</button>
</div>

<div class="card">
  <div class="card-top">
    <span class="dot"></span> Rebrand announcement · August 2026
  </div>

  <div class="card-body">
    <div class="logo-row">
      <img src="fuelomat-logo.png" class="old" alt="FuelOmat (former)">
      <span class="arrow">→</span>
      <img src="fluenix-logo.png" class="new" alt="Fluenix">
    </div>
    <div class="headline">
      Same team. Sharper mission. <span class="accent">New name.</span>
    </div>
  </div>

  <div class="card-bottom">
    <div class="stats">
      <div class="stat"><strong>17 years</strong><span>since 2008</span></div>
      <div class="stat"><strong>850+</strong><span>fuel stations worldwide</span></div>
      <div class="stat"><strong>45,000+</strong><span>connected vehicles</span></div>
    </div>
    <div class="site">fluenix.eu</div>
  </div>
</div>

</body>
</html>
