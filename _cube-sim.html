:root,body{font-family:'Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}

  /* ==========================================================
     FLUENIX BRAND THEME

     Barvy z Brand Guidelines (oficiální):
     - Fluenix Green:    #27dbde (primární akce, OK, START)
     - Fluenix Graphite: #303935 (tmavé pozadí, neutrální)
     - Fluenix Bronze:   #CB6015 (sekundární, varování, Diesel)

     Odvozené tóny pro tmavý theme:
     - Graphite Deep:    #16191d (hluboké pozadí, ještě tmavší než Graphite)
     - Graphite Mid:     #16191d (panel/karta)
     - Graphite Soft:    #1d2127 (tlačítka)

     Typografie: Figtree (přes Google Fonts) s fallback systém
  ========================================================== */
  /* Pozn.: externí Google font odstraněn kvůli offline zařízení; používá se systémový bezpatkový font (fallback níže). */

  :root {
    /* Pozadí - hierarchie tří úrovní */
    --bg-page:        #1a1c1f;     /* nejtmavší - okolo zařízení */
    --bg-card:        #16191d;     /* tělo zařízení (Graphite Deep) */
    --bg-display:     #16191d;     /* vnitřní display panel (Graphite Mid) */
    --bg-button:      #1d2127;     /* tlačítka (Graphite Soft) */

    /* Hranice */
    --border-default: #323232;
    --border-strong:  #323232;

    /* Text */
    --text-primary:   #ffffff;
    --text-muted:     #808080;
    --text-faint:     #808080;

    /* Fluenix akcenty (přesné brand hodnoty z Brand Guidelines Sheet) */
    --accent-green:    #27dbde;    /* Fluenix Green · Pantone 3272 C · RGB 0/165/155 */
    --accent-orange:   #CB6015;    /* Fluenix Bronze · Pantone 302 C · RGB 203/96/21 */
    --accent-blue:     #5aa8d4;    /* doplňková modrá (km/MTH, AdBlue) */
    --accent-yellow:   #d4a85a;    /* pauza (zachováno) */
    --accent-red:      #d24f4f;    /* kritická chyba */
    --accent-red-soft: #ff8888;    /* chyba textu */

    /* Přesné Fluenix brand barvy (oficiální) */
    --fluenix-green:    #27dbde;   /* RGB 0/165/155 · CMYK 100/0/51/0 */
    --fluenix-graphite: #3D3935;   /* RGB 61/57/53 · CMYK 0/7/13/76 · Pantone Black 7C */
    --fluenix-bronze:   #CB6015;   /* RGB 203/96/21 · CMYK 0/53/90/20 · Pantone 302 C */

    /* Typografie */
    --font-sans: 'Satoshi', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    --font-mono: Menlo, Monaco, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    color: #ffffff;
    font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  body {
    display: flex;
    align-items: stretch;
    justify-content: stretch;
  }

  .stage {
    display: flex;
    gap: 18px;
    align-items: flex-start;
    width: 100%;
    max-width: 1240px;
    justify-content: center;
  }
  @media (max-width: 1100px) {
    .stage { flex-direction: column; align-items: center; }
  }

  .device-wrap { flex-shrink: 0; }

  .sim-panel {
    width: 380px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #14161a 0%, #0e1013 100%);
    border: 1px solid #1f232b;
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .sim-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 4px 8px;
    border-bottom: 1px solid #323232;
  }
  .sim-led {
    width: 9px; height: 9px;
    background: #CB6015;
    border-radius: 50%;
    box-shadow: 0 0 10px #CB6015;
    
  }
  .sim-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: #ffffff;
  }
  .sim-sub {
    font-size: 11px;
    color: #808080;
    margin-left: auto;
    font-weight: 500;
  }

  .sim-pump-tabs {
    display: grid;
    gap: 4px;
  }
  .sim-pump-tab {
    background: #1d2127;
    color: #808080;
    border: 1.5px solid #323232;
    border-radius: 7px;
    padding: 7px 10px;
    font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    transition: all 0.15s;
  }
  .sim-pump-tab.active {
    background: rgba(203,96,21,0.10);
    border-color: #CB6015;
    color: #ffffff;
  }
  .sim-pump-tab .pn {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }
  .sim-pump-tab .pst {
    font-size: 10px;
    letter-spacing: 0.3px;
    font-weight: 600;
  }

  .sim-section-label {
    font-size: 10px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #808080;
    font-weight: 700;
    padding: 4px 4px 0;
    margin-top: 4px;
  }

  .sim-status-card {
    background: rgba(0,0,0,0.3);
    border: 1px solid #323232;
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .sim-status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
  }
  .sim-status-row .lbl {
    color: #808080;
    font-weight: 600;
    min-width: 60px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-size: 10px;
  }
  .sim-status-row .val {
    color: #ffffff;
    font-weight: 600;
    font-family: Menlo, Monaco, Consolas, monospace;
  }
  .sim-status-row .val.empty { color: #808080; font-style: italic; font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, Arial, sans-serif; font-weight: 500; }

  .sim-events {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .sim-event-btn {
    background: #1d2127;
    color: #ffffff;
    border: 1.5px solid #323232;
    border-radius: 8px;
    padding: 9px 11px;
    font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 9px;
    text-align: left;
    transition: all 0.12s;
    position: relative;
  }
  .sim-event-btn:hover:not(:disabled) {
    border-color: #CB6015;
    background: rgba(203,96,21,0.08);
  }
  .sim-event-btn:active:not(:disabled) { transform: scale(0.98); }
  .sim-event-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .sim-event-btn .num {
    background: rgba(203,96,21,0.12);
    color: #CB6015;
    border: 1px solid rgba(203,96,21,0.3);
    border-radius: 5px;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .sim-event-btn.next .num {
    background: #CB6015;
    color: #16191d;
    box-shadow: 0 0 12px rgba(203,96,21,0.5);
    
  }
  .sim-event-btn.next {
    border-color: #CB6015;
    background: rgba(203,96,21,0.10);
  }
  .sim-event-btn .lbl {
    flex: 1;
    line-height: 1.25;
    min-width: 0;
  }
  .sim-event-btn .lbl .ttl { font-weight: 700; color: #ffffff; }
  .sim-event-btn .lbl .desc { font-size: 10px; color: #808080; font-weight: 500; }
  .sim-event-btn:disabled .lbl .ttl { color: #808080; }
  .sim-event-btn:disabled .lbl .desc { color: #808080; }
  .sim-event-btn .icon {
    flex-shrink: 0;
    color: #808080;
  }
  .sim-event-btn.danger:hover:not(:disabled) {
    border-color: #d24f4f;
    background: rgba(212,79,79,0.08);
  }
  .sim-event-btn.success:hover:not(:disabled) {
    border-color: #27dbde;
    background: rgba(0,165,155,0.08);
  }

  .sim-actor-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
  }
  .sim-actor-btn {
    background: #1d2127;
    color: #ffffff;
    border: 1.5px solid #323232;
    border-radius: 6px;
    padding: 6px 8px;
    font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    line-height: 1.2;
  }
  .sim-actor-btn .actor-name { color: #ffffff; }
  .sim-actor-btn .actor-id { color: #808080; font-size: 9px; font-family: Menlo, Monaco, Consolas, monospace; }
  .sim-actor-btn:hover { border-color: #CB6015; }
  .sim-actor-btn.active { background: rgba(203,96,21,0.10); border-color: #CB6015; }

  .sim-reset {
    background: rgba(212,79,79,0.12);
    color: #ff8888;
    border: 1.5px solid rgba(212,79,79,0.4);
    border-radius: 7px;
    padding: 8px;
    font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.4px;
  }

  .sim-log {
    background: rgba(0,0,0,0.4);
    border: 1px solid #323232;
    border-radius: 7px;
    padding: 7px 10px;
    max-height: 120px;
    overflow-y: auto;
    font-family: Menlo, Monaco, Consolas, monospace;
    font-size: 10px;
    color: #808080;
    line-height: 1.5;
  }
  .sim-log .lline {
    display: flex;
    gap: 6px;
  }
  .sim-log .ltime {
    color: #808080;
    flex-shrink: 0;
  }
  .sim-log .ltext {
    color: #808080;
    flex: 1;
  }
  .sim-log .ltext.green { color: #27dbde; }
  .sim-log .ltext.orange { color: #CB6015; }
  .sim-log .ltext.red { color: #ff8888; }

  .page-header {
    text-align: center;
    max-width: 720px;
    width: 100%;
  }
  .page-title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.3px;
  }
  .page-title .accent { color: #27dbde; }
  .page-sub {
    font-size: 13px;
    color: #808080;
    margin: 0;
    line-height: 1.4;
  }

  .pump-selector {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .pump-btn {
    background: #1d2127;
    color: #ffffff;
    border: 1.5px solid #323232;
    border-radius: 6px;
    padding: 7px 16px;
    font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .pump-btn:hover {
    border-color: #323232;
  }
  .pump-btn.active {
    background: #27dbde;
    color: #16191d;
    border-color: #27dbde;
  }

  .device {
    width: 100vw;
    height: 100vh;
    background:
      radial-gradient(circle at 82% 16%, rgba(150,165,40,0.12), rgba(150,165,40,0) 38%),
      radial-gradient(circle at 12% 88%, rgba(150,165,40,0.08), rgba(150,165,40,0) 36%),
      linear-gradient(135deg, #000000 0%, #000000 100%);
    border-radius: 0;
    padding: 20px;
    box-sizing: border-box;
    border: none;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .device-glow {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 240px;
    background: radial-gradient(ellipse at top, rgba(0,165,155,0.10), transparent 70%);
    pointer-events: none;
  }

  .tabs {
    display: grid;
    gap: 4px;
    margin-bottom: 5px;
    position: relative;
  }
  .tab {
    cursor: pointer;
    border-radius: 7px;
    box-sizing: border-box;
    transition: all 0.15s;
    user-select: none;
  }
  .tab:active { opacity: 0.8; }

  .display {
    flex: 1;
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    min-height: 0;
    box-shadow: none;
  }

  .action-bar {
    display: block;
    margin-top: 8px;
    position: relative;
  }
  .action-bar button {
    font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.08s ease;
    user-select: none;
  }
  .action-bar button:active { opacity: 0.78; }
  button { transition: opacity 0.08s ease; }
  button:active { opacity: 0.82; }

  .modal-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, #1f2624 0%, #161b19 100%);
    display: flex;
    padding: 10px;
    border-radius: 0;
    flex-direction: column;
  }

  @keyframes flpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes flbtnpulse {
    0%,100% { box-shadow: 0 0 20px rgba(0,165,155,0.3); }
    50%     { box-shadow: 0 0 30px rgba(0,165,155,0.6); }
  }
  @keyframes flbtnpulseRed {
    0%,100% { box-shadow: 0 0 20px rgba(212,79,79,0.3); }
    50%     { box-shadow: 0 0 30px rgba(212,79,79,0.6); }
  }

  .footer {
    font-size: 11px;
    color: #808080;
    text-align: center;
    line-height: 1.5;
    max-width: 600px;
  }
  .footer a { color: #808080; text-decoration: none; border-bottom: 1px dotted #808080; }
  .footer a:hover { color: #27dbde; border-color: #27dbde; }

  /* responsive: na malých displejích zařízení vyplní šířku */
  @media (max-width: 720px) {
    body { padding: 12px 8px 24px; gap: 12px; }
    .page-title { font-size: 18px; }
    .page-sub { font-size: 12px; }
    .pump-btn { padding: 6px 12px; font-size: 12px; }
  }

  /* Vlastní scrollbar v modálních dialozích */
  .modal-overlay ::-webkit-scrollbar { width: 6px; }
  .modal-overlay ::-webkit-scrollbar-track { background: transparent; }
  .modal-overlay ::-webkit-scrollbar-thumb { background: #323232; border-radius: 3px; }
</style>
</head>
<body>

  <div id="fl-root" class="device">
    <div id="fl-tabs" class="tabs"></div>
    <div id="fl-display" class="display"></div>
    <div id="fl-action-bar" class="action-bar"></div>
  </div>

  if (!window.requestAnimationFrame){

  function flGroupInt(n){

    for (var i=s.length-1; i>=0; i--){ out = s.charAt(i)+out; if (++c % 3 === 0 && i>0){ out = ' '+out; } }

  /* ==========================================================
     SPOLEHLIVÝ DOTYK NA REZISTIVNÍM PANELU
     Tvrdší stisk na rezistivním displeji bod mírně posune a
     prohlížeč "click" zruší jako tah → "nic se nestane".
     Tento shim spustí akci už při uvolnění dotyku s velkou
     tolerancí pohybu a potlačí duplicitní nativní click.
  ========================================================== */
  (function(){
    var sx=0, sy=0, target=null, moved=false, inSynth=false, synthAt=0;
    var SLOP=50; // tolerance pohybu v px (rezistivní jitter)
    function findClickable(el){
      while (el && el.nodeType === 1){
        if (el.tagName === 'BUTTON') return el;
        if (el.className && typeof el.className === 'string' && /(^|\s)tab(\s|$)/.test(el.className)) return el;
        if (typeof el.onclick === 'function') return el;
        el = el.parentNode;
      }
      return null;
    }

      if (!e.touches || e.touches.length !== 1){ target=null; return; }

      target = findClickable(e.target);
    }, true);
    document.addEventListener('touchmove', function(e){
      if (!target || !e.touches || !e.touches.length) return;
      var t=e.touches[0];
      if (Math.abs(t.clientX-sx) > SLOP || Math.abs(t.clientY-sy) > SLOP) moved=true;

      if (!el || moved) return;            // tah (scroll) necháme být
      if (el.disabled) return;

      inSynth = true; synthAt = +new Date();
      try { if (typeof el.click === 'function') el.click(); else if (el.onclick) el.onclick({}); }
      catch(err){}
      inSynth = false;
    }, false);
    // zahodí duplicitní nativní click krátce po syntetickém
    document.addEventListener('click', function(e){

  /* Hlavní překladová funkce. Vrátí překlad nebo klíč pokud neexistuje.
     Podporuje placeholdery: t('hello.name', {name:'Jan'}) → "Ahoj Jan!" */
  function t(key, vars){
    var dict = translations[currentLang] || translations.cs;
    var s = dict[key];
    if (s === undefined){
      // Fallback na CS pokud chybí EN překlad
      s = translations.cs[key];
      if (s === undefined) return key;
    }
    if (vars){
      Object.keys(vars).forEach(function(k){
        s = s.replace('{' + k + '}', vars[k]);
      });
    }
    return s;
  }

  function setLang(lang){
    if (lang !== 'cs' && lang !== 'en') return;
    currentLang = lang;
    try { localStorage.setItem('fluenix_lang', lang); } catch(e){}
    simLog(t('simlog.langSwitch'), 'orange');
    updateStaticTexts();
    render();
  }

  /* Aktualizuje texty všech elementů s data-i18n atributem.
     Voláno při změně jazyka a při inicializaci. */
  function updateStaticTexts(){
    if (typeof document === 'undefined') return;
    var els = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < els.length; i++){
      var el = els[i];
      var key = el.getAttribute('data-i18n');
      var translated = t(key);
      var useHtml = el.getAttribute('data-i18n-html') === 'true';
      if (useHtml) el.innerHTML = translated;
      else el.textContent = translated;
    }
  }

  /* ==========================================================
     LOCALE — měna a formátování čísel / data

     Měna se odvozuje od jazyka (předpoklad: typická nasazená lokace).
     Pokud bude třeba EUR ve CS verzi nebo jiné kombinace,
     stačí přidat option do Settings → Lokalita.
  ========================================================== */
  var localeConfig = {
    cs: { currency: 'Kč', currencyCode: 'CZK', decimalSep: ',', thousandSep: ' ', dateFmt: 'dd.mm.yyyy', timeFmt: '24h' },
    en: { currency: '€',  currencyCode: 'EUR', decimalSep: '.', thousandSep: ',', dateFmt: 'mm/dd/yyyy', timeFmt: '12h' }
  };
  function loc(){ return localeConfig[currentLang] || localeConfig.cs; }
  function currency(){ return loc().currency; }
  function currencyCode(){ return loc().currencyCode; }

  /* Formátování čísla podle locale: 1234.56 → CS "1 234,56" / EN "1,234.56" */
  function fmtLocale(n, decimals){
    var L = loc();
    decimals = (decimals === undefined) ? 2 : decimals;
    var fixed = Math.abs(n).toFixed(decimals);
    var parts = fixed.split('.');
    // tisíce
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, L.thousandSep);
    var out = parts.join(L.decimalSep);
    return (n < 0 ? '-' : '') + out;
  }

  /* Formátování celých čísel (litry, množství) */
  function fmtInt(n){ return fmtLocale(n, 0); }

  /* Formátování ceny s měnou. fmtPrice(830) → CS "830 Kč" / EN "€830" */
  function fmtPrice(n, decimals){
    var L = loc();
    var num = fmtLocale(n, decimals === undefined ? 0 : decimals);
    if (currentLang === 'cs') return num + ' ' + L.currency;
    return L.currency + num; // EN: měna před číslem (€830)
  }

  /* Datum dle locale.
     Vstup: Date objekt nebo string "DD.MM.YYYY" (CS) — automaticky parsujeme.
     Výstup: CS "3.5.2026" / EN "May 3, 2026" */
  var enMonths = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDate(input){
    var d;
    if (input instanceof Date) d = input;
    else if (typeof input === 'string'){
      // Parsuj CS formát "DD.MM.YYYY"
      var m = input.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
      if (m) d = new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
      else d = new Date(input);
    } else d = new Date();
    if (isNaN(d.getTime())) return String(input);

    var day = d.getDate();
    var mon = d.getMonth();
    var yr  = d.getFullYear();
    if (currentLang === 'en'){
      return enMonths[mon] + ' ' + day + ', ' + yr;
    }
    return day + '.' + (mon+1) + '.' + yr;
  }

  /* Datum stručně bez roku — pro hlavičky transakcí */
  function fmtDateShort(input){
    var d = (input instanceof Date) ? input : new Date(input);
    if (isNaN(d.getTime())) return String(input);
    if (currentLang === 'en') return enMonths[d.getMonth()] + ' ' + d.getDate();
    return d.getDate() + '.' + (d.getMonth()+1) + '.';
  }

  /* ==========================================================

  var stateMap = {

    armed:           { color: '#27dbde',   dot: '#27dbde',   pulse: true  },
    readyToFuel:     { color: '#27dbde',   dot: '#27dbde',   pulse: true  },
    fueling:         { color: '#27dbde',   dot: '#27dbde',   pulse: true  },
    paused:          { color: '#d4a85a',  dot: '#d4a85a',  pulse: true  },

    bypass:          { color: '#d24f4f',     dot: '#d24f4f',     pulse: true  }
  };

  /* Mapování status → hint key (auto režim) */
  var statusToHintKey = {
    ready:          'hint.readyAuto',
    lifted:         'hint.lifted',
    waitingDriver:  'hint.driver',
    waitingVehicle: 'hint.vehicle',
    waitingPin:     'hint.pin',
    waitingKmMth:   'hint.kmMth',
    armed:          'hint.armed',
    readyToFuel:    'hint.armed',
    fueling:        'hint.fueling',
    paused:         'hint.paused',
    hung:           'hint.saved',
    saved:          'hint.saved',
    bypass:         'hint.bypass'
  };

  /* Aktualizace stavu s překladem labelu a hintu */
  function applyStateLabels(p){
    var s = stateMap[p.status];
    if (!s) return null;
    var hintKey = statusToHintKey[p.status] || 'hint.ready';
    return {
      color: s.color,
      dot: s.dot,
      pulse: s.pulse,
      label: t('status.' + p.status),
      short: t('status.' + p.status),
      hint:  t(hintKey)
    };
  }

  /* ==========================================================
     UTILITY
  ========================================================== */
  function fmtNum(n){
    var parts = n.toFixed(1).split('.');
    var intPart = flGroupInt(parseInt(parts[0]));
    return intPart + ',' + parts[1];
  }
  function fmtPrice(n){
    var parts = n.toFixed(2).split('.');
    var intPart = flGroupInt(parseInt(parts[0]));
    return intPart + ',' + parts[1];
  }
  function fmtInt(n){ return flGroupInt(n); }
  function fuelColor(fuel){
    if (fuel === 'Diesel')  return '#CB6015';
    if (fuel === 'AdBlue')  return '#5aa8d4';
    return '#27dbde';
  }
  function isStopState(p){ return p.status === 'fueling' || p.status === 'paused' || p.status === 'lifted'; }

    if (settings.pumpCount === 1){ tabsEl.style.display = 'none'; return; }
    tabsEl.style.display = 'grid';
    tabsEl.innerHTML = '';
    var n = settings.pumpCount;
    var compact = n >= 5;
    var medium  = n === 4;
    var spacious = n <= 3;

    if (n <= 4)      tabsEl.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
    else if (n <= 6) tabsEl.style.gridTemplateColumns = 'repeat(6, 1fr)';
    else             tabsEl.style.gridTemplateColumns = 'repeat(8, 1fr)';

    pumps.forEach(function(p){
      var s = applyStateLabels(p);
      var fc = fuelColor(p.fuel);
      var isActive = p.id === activeTab;
      var isFueling = p.status === 'fueling';
      var tabEl = document.createElement('div');
      tabEl.className = 'tab';

      var bg = isActive ? '#1d2127' : '#16191d';

        ';padding:' + (spacious ? '6px 12px' : compact ? '5px 6px' : '5px 10px') +

                   '<div style="font-size:11px;color:#27dbde;font-variant-numeric:tabular-nums;font-weight:600;">' + fmtNum(p.liters * p.price) + ' ' + currency() + '</div>' +
                 '</div>';
        }

          '<div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;">' +
            '<div style="font-size:26px;font-weight:600;color:' + (isActive ? '#fff' : '#808080') + ';line-height:1;flex-shrink:0;">' + p.id + '</div>' +
            '<div style="min-width:0;flex:1;">' +

                '<span style="font-size:11px;color:' + s.color + ';font-weight:600;letter-spacing:0.3px;">' + s.label + '</span>' +
              '</div>' +

            '<div style="display:flex;align-items:center;gap:5px;width:100%;">' +

            '</div>' +

        tabEl.innerHTML =
          '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;">' +
            '<div style="display:flex;align-items:center;gap:4px;">' +

  /* ==========================================================
     AUTO-FIT: dynamicky zmenší font podle dostupného místa
     (řeší hraniční hodnoty 99 999,99 L a 9 998 999 Kč)
  ========================================================== */
  function autoFitNumbers(){
    var litersEl = document.getElementById('fl-liters');
    var unitEl   = document.getElementById('fl-liters-unit');
    if (!litersEl) return;
    var litersRow = litersEl.parentElement;
    if (!litersRow) return;
    fitOne(litersEl, litersRow, 180, 44, function(size){ if (unitEl){ unitEl.style.fontSize = Math.round(size * 0.40) + 'px'; } });
  }
  function fitOne(el, container, maxSize, minSize, sideEffect, _tries){
    if (!container){ el.style.fontSize = maxSize + 'px'; if (sideEffect) sideEffect(maxSize); return; }
    var contW = container.clientWidth;
    var contH = container.clientHeight;
    if (contW <= 0 || contH <= 0){
      el.style.fontSize = minSize + 'px'; if (sideEffect) sideEffect(minSize);
      if ((_tries || 0) < 4) requestAnimationFrame(function(){ fitOne(el, container, maxSize, minSize, sideEffect, (_tries || 0) + 1); });
      return;
    }
    var size = maxSize;
    el.style.fontSize = size + 'px'; if (sideEffect) sideEffect(size);
    // šířku měříme přes obsah celého kontejneru (číslo + jednotka), výšku přes číslo
    var ew = Math.max(el.getBoundingClientRect().width, container.scrollWidth);
    var eh = el.getBoundingClientRect().height;
    var ratio = 1;
    if (ew > contW) ratio = Math.min(ratio, contW / ew);
    if (eh > contH) ratio = Math.min(ratio, contH / eh);
    if (ratio < 1){
      size = Math.floor(size * ratio) - 1;
      if (size < minSize) size = minSize;
      el.style.fontSize = size + 'px'; if (sideEffect) sideEffect(size);
      // korekce podle šířky obsahu, pokud stále přetéká
      ew = Math.max(el.getBoundingClientRect().width, container.scrollWidth);
      if (ew > contW && size > minSize){
        size = Math.max(minSize, Math.floor(size * contW / ew) - 1);
        el.style.fontSize = size + 'px'; if (sideEffect) sideEffect(size);
      }
    }
  }
  function fitOne_OLD(el, container, maxSize, minSize, sideEffect){
    if (!container){ el.style.fontSize = maxSize + 'px'; if (sideEffect) sideEffect(maxSize); return; }
    var contW = container.clientWidth;
    var contH = container.clientHeight;
    if (contW <= 0){ el.style.fontSize = maxSize + 'px'; if (sideEffect) sideEffect(maxSize); return; }
    var size = maxSize;
    el.style.fontSize = size + 'px';
    if (sideEffect) sideEffect(size);
    // jediné měření -> spočítáme poměr zmenšení (místo 30 reflowů)
    var sw = container.scrollWidth;
    var eh = el.getBoundingClientRect().height;
    var ratio = 1;
    if (sw > contW + 1) ratio = Math.min(ratio, contW / sw);
    if (eh > contH && eh > 0) ratio = Math.min(ratio, contH / eh);
    if (ratio < 1){
      size = Math.floor(size * ratio) - 1;
      if (size < minSize) size = minSize;
      el.style.fontSize = size + 'px';
      if (sideEffect) sideEffect(size);
      // jedna korekce, pokud stále přetéká
      if (size > minSize && container.scrollWidth > contW + 1){
        size = Math.max(minSize, size - 4);
        el.style.fontSize = size + 'px';
        if (sideEffect) sideEffect(size);
      }
    }
  }

  /* ==========================================================
     1-STOJAN: interaktivní START/STOP

     Zjednodušená logika pro stolní / 1-stojanový dispenser:
     - START z ready: auto-zvedne pistoli + použije aktuálně
       vybranou obsluhu/vozidlo z hardware simulátoru, pak
       čeká na uživatele aby stiskl spoušť (krok 4)
     - START z paused: pokračovat
     - STOP: zavěsit pistoli a uložit
  ========================================================== */
  function handleSinglePumpStartStop(p){
    if (p.bypass){
      // V bypass je tlačítko zablokované
      return;
    }
    if (p.flow){
      // Probíhá tankování → STOP = ukončí transakci (tlačítko Stop nahrazuje pověšení pistole)
      hwStopFlow(p);
      return;
    }
    if (p.status === 'paused'){
      hwResumeFlow(p);
      return;
    }
    if (p.status === 'ready' || p.status === 'saved'){
      // Nasazení na zařízení: START = zvednout pistoli + autorizovat
      // univerzálním čipem + spustit průtok. Žádný HW panel není potřeba.
      hwLiftNozzle(p);
      hwScanVehicle(p, universalChip);
      if (!authorizationOk(p)){
        simLog('Stojan ' + p.id + ': autorizace univerzálním čipem selhala', 'red');
        return;
      }
      hwArmFlow(p);
      hwStartFlow(p);
      return;
    }
    if (p.status === 'lifted' || p.status === 'waitingVehicle' || p.status === 'waitingDriver' || p.status === 'waitingPin' || p.status === 'waitingKmMth'){
      // čekáme na autorizaci - když uživatel klepne Start, je to "Start tankování"
      if (authorizationOk(p)){
        hwArmFlow(p);
        if (p.nozzle === 'lifted') hwStartFlow(p);
      } else {
        simLog('Stojan ' + p.id + ': dokončete autorizaci', 'orange');
      }
      return;
    }
    if (p.status === 'armed' || p.status === 'readyToFuel'){
      // Autorizováno - jen spustit průtok
      if (p.nozzle !== 'lifted'){
        // pistole ještě nezvednutá - simulujeme zvednutí + start
        hwLiftNozzle(p);
      }
      hwStartFlow(p);
      return;
    }
  }

  /* ==========================================================
     LOGIKA: HARDWARE EVENTS (řízeno simulátorem)

     Tok událostí (typický scénář):
       hwLiftNozzle()     -> nozzle: lifted, status: lifted
       hwScanDriver(d)    -> driver=d, status: waitingVehicle
       hwScanVehicle(v)   -> vehicle=v, status: readyToFuel
       hwStartFlow()      -> flow=true, status: fueling, ticker běží
       hwInterruptFlow()  -> flow=false, status: paused (pistole stále zvednutá)
       hwResumeFlow()     -> flow=true, status: fueling
       hwHangNozzle()     -> nozzle=hung, flow=false, status: hung -> saved -> ready
  ========================================================== */
  /* ==========================================================
     STATE MACHINE - klíč k chování stojanu

     Skládáme z hardware vstupů + nastavení:
       p.bypass         → BYPASS režim (počítadlo bez autorizace)
       p.nozzle         → 'hung' / 'lifted'
       p.driver         → null / { name, id }
       p.vehicle        → null / { plate, id, requiresDriver, requiresPin, requiresKmMth }
       p.vehiclePinOk   → true pokud vozidlo s requiresPin už zadalo PIN
       p.flowArmed      → true pokud byl stisknut "Start tankování" (ventil otevřený, čekáme na spoušť)
       p.flow           → true pokud spoušť pistole sepnutá (litry rostou)

     Statusy v stateMap:
       ready           - klidový stav, pistole zavěšena
       lifted          - pistole zvednutá, žádné RFID
       waitingDriver   - vozidlo načteno, ale chybí řidič (a vozidlo ho vyžaduje)
       waitingVehicle  - řidič ověřen, ale chybí vozidlo
       waitingPin      - vozidlo vyžaduje PIN, ale nebyl zadán
       waitingKmMth    - vozidlo vyžaduje km/MTH, ale nebylo zadáno
       armed           - autorizace OK, ventil otevřen ("Start tankování"), čekáme na spoušť
       fueling         - spoušť sepnutá, litry rostou
       paused          - tankování pozastaveno
       hung            - pistole zavěšena (přechodový stav)
       saved           - transakce uložena
       bypass          - speciální stav: bypass režim aktivní
  ========================================================== */
  function deriveStatus(p){
    if (p.bypass) return 'bypass';
    if (p.flow) return 'fueling';
    if (p.nozzle === 'hung'){
      if (p.status === 'hung' || p.status === 'saved') return p.status;
      return 'ready';
    }
    // pistole zvednutá
    if (!p.driver && !p.vehicle) return 'lifted';

    var v = p.vehicle;
    // Vozidlo načteno - kontroluj požadavky
    if (v){
      if (v.requiresDriver && !p.driver) return 'waitingDriver';
      if (v.requiresPin && !p.vehiclePinOk) return 'waitingPin';
      if (v.requiresKmMth && (p.kmMth === null || p.kmMth === '')) return 'waitingKmMth';
    } else {
      // jen řidič - chybí vozidlo
      return 'waitingVehicle';
    }

    if (p.flowArmed) return 'armed';
    if (p.liters > 0) return 'paused';
    return 'readyToFuel';
  }

  function authorizationOk(p){
    if (!p.vehicle) return false;
    var v = p.vehicle;
    if (v.requiresDriver && !p.driver) return false;
    if (v.requiresPin && !p.vehiclePinOk) return false;
    if (v.requiresKmMth && (p.kmMth === null || p.kmMth === '')) return false;
    return true;
  }

  function hwLiftNozzle(p){
    if (p.nozzle === 'lifted') return;
    p.nozzle = 'lifted';
    p.nozzleInserted = false;
    p.liters = 0;
    p.startTime = null;
    p.status = deriveStatus(p);
    simLog(t('common.pump') + p.id + ': ' + t('simlog.lifted'), 'orange');
    render();
  }
  /* Vložení pistole do nádrže — RFID čtečka v pistoli ověří vozidlo */
  function hwInsertNozzle(p){
    if (p.nozzle !== 'lifted'){ simLog('Stojan ' + p.id + ': nelze vložit (pistole zavěšená)', 'red'); return; }
    if (p.nozzleInserted) return;
    p.nozzleInserted = true;
    simLog(t('common.pump') + p.id + ': ' + t('simlog.inserted'), 'orange');
    render();
  }
  /* Vyjmutí pistole z nádrže (bez zavěšení do držáku) — ztráta RFID vozidla */
  function hwRemoveNozzle(p){
    if (!p.nozzleInserted) return;
    p.nozzleInserted = false;
    // Ztráta vozidla pokud bylo načteno
    var hadVehicle = !!p.vehicle;
    if (p.vehicle){
      simLog(t('common.pump') + p.id + ': ' + t('simlog.removed'), 'orange');
      p.vehicle = null;
      p.vehiclePinOk = false;
    }
    // Pokud běží průtok, automaticky pozastavit
    if (p.flow){
      p.flow = false;
      stopTicker(p);
      p.rate = 0;
      p.status = 'paused';
      simLog(t('common.pump') + p.id + ': ' + t('simlog.paused'), 'orange');
    } else {
      p.status = deriveStatus(p);
    }
    render();
  }
  function hwScanDriver(p, driver){
    if (p.bypass){ simLog(t('common.pump') + p.id + ': ' + t('simlog.bypassIgn'), 'red'); return; }
    p.driver = driver;
    p.status = deriveStatus(p);
    simLog(t('common.pump') + p.id + ': ' + t('simlog.driverOk') + ' · ' + driver.name, 'green');
    render();
  }
  function hwScanVehicle(p, vehicle){
    if (p.bypass){ simLog(t('common.pump') + p.id + ': ' + t('simlog.bypassIgn'), 'red'); return; }
    p.vehicle = vehicle;
    p.vehiclePinOk = !vehicle.requiresPin; // bez PIN požadavku rovnou OK
    // Vozidlová RFID čtečka je v pistoli → načtení znamená, že pistole je u nádrže
    if (p.nozzle === 'lifted'){ p.nozzleInserted = true; }
    p.status = deriveStatus(p);
    simLog(t('common.pump') + p.id + ': ' + t('simlog.vehicleOk') + ' · ' + vehicle.plate, 'green');
    if (vehicle.requiresPin)   simLog(t('common.pump') + p.id + ': ' + t('simlog.vehicleNeedsPin'), 'orange');
    if (vehicle.requiresDriver && !p.driver) simLog(t('common.pump') + p.id + ': ' + t('simlog.vehicleNeedsDriver'), 'orange');
    if (vehicle.requiresKmMth) simLog(t('common.pump') + p.id + ': ' + t('simlog.vehicleNeedsKmMth'), 'orange');
    render();
    // Automaticky otevřít modaly pro povinné údaje
    setTimeout(function(){
      if (vehicle.requiresPin && !p.vehiclePinOk){
        openVehiclePinModal(p);
      } else if (vehicle.requiresKmMth && (p.kmMth === null || p.kmMth === '')){
        openKmMthModal(p, true);
      }
    }, 100);
  }
  function hwEnterVehiclePin(p, pin){
    if (!p.vehicle){ simLog('Stojan ' + p.id + ': nelze zadat PIN (chybí vozidlo)', 'red'); return false; }
    if (!p.vehicle.requiresPin){ simLog('Stojan ' + p.id + ': vozidlo PIN nevyžaduje', 'red'); return false; }
    if (pin === p.vehicle.pin){
      p.vehiclePinOk = true;
      simLog(t('common.pump') + p.id + ': ' + t('simlog.pinOk'), 'green');
      p.status = deriveStatus(p);
      render();
      // Pokud je další povinný údaj km/MTH, otevři ho
      if (p.vehicle.requiresKmMth && (p.kmMth === null || p.kmMth === '')){
        setTimeout(function(){ openKmMthModal(p, true); }, 100);
      }
      return true;
    } else {
      simLog(t('common.pump') + p.id + ': ' + t('simlog.pinWrong'), 'red');
      render();
      return false;
    }
  }

  /* "Start tankování" - autorizační krok PŘED spouští.
     Ventil otevře, ale palivo neteče dokud řidič nestiskne spoušť. */
  function hwArmFlow(p){
    if (p.bypass){ simLog('Stojan ' + p.id + ': BYPASS - "Start" přeskočen', 'red'); return; }
    if (!authorizationOk(p)){ simLog('Stojan ' + p.id + ': autorizace neúplná', 'red'); return; }
    if (p.nozzle !== 'lifted'){
      // Můžeme stisknout Start i před zvednutím pistole - nastavíme armed flag,
      // čeká dokud řidič nezvedne pistoli
      p.flowArmed = true;
      p.status = deriveStatus(p);
      simLog('Stojan ' + p.id + ': Start tankování (čeká na zvednutí pistole)', 'orange');
      render();
      return;
    }
    p.flowArmed = true;
    p.status = 'armed';
    simLog('Stojan ' + p.id + ': Start tankování · stiskněte spoušť pistole', 'green');
    render();
  }

  /* "Stiskni spoušť pistole" - palivo opravdu začne téct. */
  function hwStartFlow(p){
    if (p.bypass){
      // V BYPASS spoušť rovnou pustí palivo bez autorizace
      if (p.nozzle !== 'lifted'){ simLog('Stojan ' + p.id + ': nelze tankovat v BYPASS (pistole zavěšená)', 'red'); return; }
      p.flow = true;
      if (!p.startTime) p.startTime = Date.now();
      startTicker(p);
      simLog('Stojan ' + p.id + ': tankování v BYPASS', 'red');
      render();
      return;
    }
    if (!p.flowArmed){ simLog('Stojan ' + p.id + ': stiskněte nejprve Start tankování', 'red'); return; }
    if (!authorizationOk(p)){ simLog('Stojan ' + p.id + ': autorizace neúplná', 'red'); return; }
    if (p.nozzle !== 'lifted'){ simLog('Stojan ' + p.id + ': nejprve zvedněte pistoli', 'red'); return; }
    if (p.flow) return;
    p.flow = true;
    if (!p.startTime) p.startTime = Date.now();
    p.status = 'fueling';
    startTicker(p);
    simLog('Stojan ' + p.id + ': spoušť sepnuta · palivo teče', 'green');
    render();
  }
  function hwInterruptFlow(p){
    if (!p.flow) return;
    p.flow = false;
    stopTicker(p);
    p.rate = 0;
    p.status = 'paused';
    simLog('Stojan ' + p.id + ': průtok přerušen — pozastaveno', 'orange');
    render();
  }
  function hwResumeFlow(p){
    if (p.bypass){ hwStartFlow(p); return; }
    if (p.flow) return;
    if (!authorizationOk(p)){ simLog('Stojan ' + p.id + ': nelze obnovit (autorizace)', 'red'); return; }
    if (p.nozzle !== 'lifted'){ simLog('Stojan ' + p.id + ': nelze obnovit (pistole zavěšená)', 'red'); return; }
    p.flow = true;
    p.status = 'fueling';
    startTicker(p);
    simLog('Stojan ' + p.id + ': tankování pokračuje', 'green');
    render();
  }

  /* "Stop tankování" - zavře ventil, ale pistole stále zvednutá.
     V automatickém režimu se Start/Stop tlačítko nepoužívá; v automatickém + Start/Stop
     mode lze ukončit transakci tímto. */
  function hwStopFlow(p){
    if (p.flow){
      p.flow = false;
      stopTicker(p);
      p.rate = 0;
    }
    p.flowArmed = false;
    if (p.liters > 0){
      finishTransaction(p);
    } else {
      // nic se neudělalo - jen zruš autorizaci
      p.status = deriveStatus(p);
      render();
    }
  }

  function hwHangNozzle(p){
    if (p.nozzle === 'hung') return;
    p.flow = false;
    stopTicker(p);
    p.rate = 0;
    p.nozzle = 'hung'; p.nozzleInserted = false;
    p.flowArmed = false;

    if (p.bypass){
      // V BYPASS uložíme transakci jen jako "manuální" záznam
      if (p.liters > 0){
        finishTransactionBypass(p);
      } else {
        p.status = 'bypass'; // zůstaneme v bypass módu
        render();
      }
      return;
    }

    if (p.liters > 0){
      finishTransaction(p);
    } else {
      // pistole zavěšena bez tankování — reset autorizace
      p.status = 'ready';
      p.liters = 0;
      p.startTime = null;
      p.driver = null;
      p.vehicle = null;
      p.vehiclePinOk = false;
      simLog('Stojan ' + p.id + ': pistole zavěšena · stojan resetován', 'orange');
      render();
    }
  }

  function finishTransaction(p){
    p.status = 'hung';
    simLog('Stojan ' + p.id + ': pistole zavěšena · ukončuji transakci', 'orange');
    var snapshot = { liters: p.liters, price: p.liters * p.price, driver: p.driver, vehicle: p.vehicle, time: new Date() };
    render();
    setTimeout(function(){
      p.status = 'saved';
      simLog('Stojan ' + p.id + ': transakce uložena · ' + snapshot.liters.toFixed(2) + ' L · ' + Math.round(snapshot.price) + ' ' + currency() + '', 'green');
      render();
      setTimeout(function(){
        p.status = 'ready';
        p.liters = 0;
        p.startTime = null;
        p.driver = null;
        p.vehicle = null;
        p.vehiclePinOk = false;
        p.kmMth = null; p.preset = null;
        p.note = '';
        render();
      }, 2200);
    }, 700);
  }

  function finishTransactionBypass(p){
    simLog('Stojan ' + p.id + ': BYPASS transakce · ' + p.liters.toFixed(2) + ' L (manuální)', 'red');
    setTimeout(function(){
      p.liters = 0;
      p.startTime = null;
      p.status = 'bypass';
      render();
    }, 1500);
    render();
  }

  function hwToggleBypass(p){
    p.bypass = !p.bypass;
    if (p.bypass){
      // při zapnutí BYPASS - vyresetovat autorizaci
      p.driver = null;
      p.vehicle = null;
      p.vehiclePinOk = false;
      p.flowArmed = false;
      p.kmMth = null;
      p.note = '';
      p.preset = null;
      p.status = 'bypass';
      simLog('Stojan ' + p.id + ': BYPASS REŽIM ZAPNUT', 'red');
    } else {
      p.status = 'ready';
      p.liters = 0;
      p.flow = false;
      stopTicker(p);
      simLog('Stojan ' + p.id + ': BYPASS REŽIM VYPNUT', 'green');
    }
    render();
  }

  function hwReset(p){
    p.flow = false;
    stopTicker(p);
    p.rate = 0;
    p.nozzle = 'hung'; p.nozzleInserted = false;
    p.driver = null;
    p.vehicle = null;
    p.vehiclePinOk = false;
    p.flowArmed = false;
    p.bypass = false;
    p.liters = 0;
    p.startTime = null;
    p.kmMth = null; p.preset = null;
    p.note = '';
    p.status = 'ready';
    simLog('Stojan ' + p.id + ': RESET', 'red');
    render();
  }


  /* Lehká aktualizace JEN měněných hodnot během tankování — bez přestavby
     DOMu (jinak Skia/v3d hromadí GPU buffery → OOM). */
  function updateFuelingLive(p){
    var litEl = document.getElementById('fl-liters');
    if (!litEl) return false;
    litEl.textContent = fmtNum(p.liters);
    var priceEl = document.getElementById('fl-price');
    if (priceEl) priceEl.textContent = fmtPrice(p.liters * p.price);
    var prog = document.getElementById('fl-progress');
    if (prog) prog.style.width = Math.min(100, (p.liters / p.limit) * 100) + '%';
    var tEl = document.getElementById('fl-timer');
    if (tEl && p.startTime){
      var e = Math.floor((Date.now() - p.startTime) / 1000);
      tEl.textContent = '⏱ ' + String(Math.floor(e/60)).padStart(2,'0') + ':' + String(e%60).padStart(2,'0');
    }
    requestAnimationFrame(autoFitNumbers);
    return true;
  }

  function startTicker(p){
    stopTicker(p);
    tickers[p.id] = setInterval(function(){
      if (!p.flow) return;
      p.rate = (p.fast ? 150 : 16) + Math.random() * 8;
      p.liters += p.rate / 60 * 0.4;

      // Předvolba má přednost před limitem
      var stopAt = (p.preset !== null && p.preset > 0) ? Math.min(p.preset, p.limit) : p.limit;
      var reason = (p.preset !== null && p.preset > 0 && p.preset <= p.limit) ? 'předvolba' : 'limit';

      if (p.liters >= stopAt){
        p.liters = stopAt;
        p.flow = false;
        p.rate = 0;
        stopTicker(p);
        p.status = 'paused';
        simLog('Stojan ' + p.id + ': dosažen ' + reason + ' ' + stopAt + ' L — pozastaveno', 'orange');
        render();          // změna stavu → plné překreslení
      } else {
        if (!updateFuelingLive(p)) render();   // jen hodnoty, bez přestavby DOMu
      }
    }, 400);
  }
  function stopTicker(p){ if (tickers[p.id]){ clearInterval(tickers[p.id]); delete tickers[p.id]; } }

  /* ==========================================================
     MODÁLNÍ INFRASTRUKTURA
  ========================================================== */
  function makeOverlay(){
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.zIndex = 10 + modalStack.length;
    return overlay;
  }
  function pushModal(overlay){ rootEl.appendChild(overlay); modalStack.push(overlay); }
  function popModal(){ var o = modalStack.pop(); if (o) o.remove(); }
  function closeAllModals(){ while (modalStack.length){ modalStack.pop().remove(); } }

  function makeHeader(title){
    return '<div style="display:flex;align-items:center;gap:14px;flex-shrink:0;height:52px;margin-bottom:12px;">' +
      '<button class="fl-mod-back" style="width:52px;height:52px;border-radius:50%;background:#16191d;border:1.5px solid #323232;color:#e0ed07;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;">' +
        '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>' +
      '</button>' +
      '<div style="flex:1;min-width:0;font-size:20px;font-weight:700;color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + title + '</div>' +
      '<button class="fl-mod-close" style="width:52px;height:52px;border-radius:50%;background:#16191d;border:1.5px solid #323232;color:#e0ed07;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;">' +
        '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
      '</button>' +
    '</div>';
  }

  /* Horizontální swipe gesto (rezistivní dotyk: jednoprsté). */
  function addSwipe(el, h){
    var x0 = null, y0 = null;
    el.addEventListener('touchstart', function(e){ var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
    el.addEventListener('touchend', function(e){
      if (x0 === null) return;
      var t = e.changedTouches && e.changedTouches[0];
      if (!t){ x0 = null; return; }
      var dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6){
        if (dx > 0 && h.right) h.right();
        else if (dx < 0 && h.left) h.left();
      }
    }, { passive: true });
  }

  /* Hlavička má kolečko zpět (←) a kolečko × jako v mockupech.
     nav = volitelné { left, right } pro přepínání obrazovek tažením. */
  function bindHeader(overlay, onBack, nav){
    var b = overlay.querySelector('.fl-mod-back');
    if (b) b.onclick = function(){ onBack ? onBack() : popModal(); };
    var c = overlay.querySelector('.fl-mod-close');
    if (c) c.onclick = closeAllModals;
    if (nav){
      addSwipe(overlay, { left: nav.left, right: nav.right });
    } else {
      addSwipe(overlay, { right: function(){ onBack ? onBack() : popModal(); } });
    }
  }

  /* ==========================================================
     MODÁL: MTH/km
  ========================================================== */
  /* Sdílená VELKÁ numerická klávesnice (flexbox – funguje i na starším
     WebKitu, bez grid/gap). Ploché klávesy dle mockupu. */
  function buildKeypad(keysEl, onKey, fontSize){
    keysEl.style.cssText = 'flex:1;display:flex;flex-direction:column;margin:-5px;min-height:0;';
    keysEl.innerHTML = '';
    var layout = [['1','2','3'],['4','5','6'],['7','8','9'],['C','0','⌫']];
    layout.forEach(function(rowKeys){
      var r = document.createElement('div');
      r.style.cssText = 'display:flex;flex:1 1 0;min-height:0;';
      rowKeys.forEach(function(k){
        var b = document.createElement('button');
        b.textContent = k;
        var color = (k === 'C' || k === '⌫') ? '#e0ed07' : '#ffffff';
        b.style.cssText = 'flex:1 1 0;min-width:0;margin:5px;background:#16191d;color:' + color +
          ';border:1.5px solid #323232;border-radius:20px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:' +
          (fontSize || 40) + 'px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;box-sizing:border-box;';
        b.onclick = function(){ onKey(k); };
        r.appendChild(b);
      });
      keysEl.appendChild(r);
    });
  }

  function openKmMthModal(p, mandatory){
    var overlay = makeOverlay();
    var titlePrefix = mandatory ? '⚠ POVINNÝ ÚDAJ · ' : '';
    var headerHtml = mandatory
      ? // mandatory header bez × tlačítka
        '<div style="display:flex;align-items:center;justify-content:space-between;flex-shrink:0;margin-bottom:6px;">' +
          '<div style="display:flex;align-items:center;gap:8px;">' +
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CB6015" stroke-width="2.5"><path d="M12 2L2 22h20zM12 9v5M12 18h.01"/></svg>' +
            '<div style="font-size:18px;font-weight:700;color:#ffffff;">Zadejte stav km/MTH · Stojan ' + p.id + '</div>' +
          '</div>' +
        '</div>'
      : makeHeader(t('km.title') + p.id);

    var bannerHtml = mandatory
      ? '<div style="background:rgba(203,96,21,0.12);border:1.5px solid rgba(203,96,21,0.5);border-radius:8px;padding:8px 12px;margin-bottom:6px;flex-shrink:0;display:flex;align-items:center;gap:8px;">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CB6015" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>' +
          '<span style="font-size:12px;color:#ffffff;font-weight:600;">Vozidlo <strong>' + (p.vehicle ? p.vehicle.plate : '?') + '</strong> vyžaduje pro tankování zadání aktuálního stavu km/MTH.</span>' +
        '</div>'
      : '';

    var actionsHtml = mandatory
      ? '<button class="fl-ok" style="background:#27dbde;color:#16191d;border:1.5px solid #27dbde;border-radius:8px;padding:14px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:18px;font-weight:700;cursor:pointer;min-height:62px;width:100%;">POTVRDIT ✓</button>'
      : '<div style="display:flex;margin:0 -5px;flex-shrink:0;">' +
          '<button class="fl-cancel" style="flex:1;margin:0 5px;background:#16191d;color:#fd705c;border:1.5px solid #fd705c;border-radius:20px;height:64px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg><span>CANCEL</span></button>' +
          '<button class="fl-ok" style="flex:1;margin:0 5px;background:#27dbde;color:#000000;border:none;border-radius:20px;height:64px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M8.3 12.4l2.6 2.6 4.8-5.2"/></svg><span>ENTER</span></button>' +
        '</div>';

    overlay.innerHTML =
      headerHtml +
      bannerHtml +
      '<div id="fl-input" style="background:#16191d;border:1.5px solid ' + (mandatory ? '#CB6015' : '#323232') + ';border-radius:24px;padding:8px 30px;font-family:Satoshi, Menlo, Monaco, Consolas, monospace;font-size:64px;color:#ffffff;text-align:right;font-weight:700;height:108px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;letter-spacing:1px;margin-bottom:10px;"></div>' +
      '<div class="fl-keys" style="flex:1;display:flex;flex-direction:column;min-height:0;"></div>' +
      '<div style="margin-top:8px;flex-shrink:0;">' + actionsHtml + '</div>';
    pushModal(overlay);
    if (!mandatory) bindHeader(overlay);

    var value = String(p.kmMth || '');
    var inputEl = overlay.querySelector('#fl-input');
    var keysEl  = overlay.querySelector('.fl-keys');
    function refresh(){
      if (value){ inputEl.textContent = value; }
      else inputEl.innerHTML = '<span style="color:#808080;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:18px;font-weight:500;letter-spacing:0;">— zadejte hodnotu —</span>';
    }
    refresh();
    buildKeypad(keysEl, function(k){
      if (k === 'C') value = '';
      else if (k === '⌫') value = value.slice(0, -1);
      else if (value.length < 9) value += k;
      refresh();
    }, 26);
    var cancelBtn = overlay.querySelector('.fl-cancel');
    if (cancelBtn) cancelBtn.onclick = popModal;
    overlay.querySelector('.fl-ok').onclick = function(){
      if (mandatory && !value){
        // nelze zavřít bez hodnoty
        inputEl.style.borderColor = '#d24f4f';
        setTimeout(function(){ inputEl.style.borderColor = '#CB6015'; }, 800);
        return;
      }
      p.kmMth = value ? parseInt(value) : null;
      popModal(); render();
    };
  }

  /* ==========================================================
     MODÁL: PIN VOZIDLA (povinný)

     Otevírá se automaticky po přiložení vozidla s requiresPin.
     Nelze zavřít bez správného PIN.
  ========================================================== */
  function openVehiclePinModal(p){
    var overlay = makeOverlay();
    overlay.innerHTML =
      // mandatory header bez × tlačítka
      '<div style="display:flex;align-items:center;justify-content:space-between;flex-shrink:0;margin-bottom:6px;">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CB6015" stroke-width="2.5"><path d="M12 2L2 22h20zM12 9v5M12 18h.01"/></svg>' +

          '</div>' +
          '<div id="fl-vpin-msg" style="font-size:11px;color:#808080;font-weight:600;text-align:center;min-height:14px;line-height:1.2;">Zadejte 4-místný PIN</div>' +
          '<div style="display:flex;margin:0 -3px;flex-shrink:0;">' +

            '<button class="fl-ok" style="flex:1;margin:0 3px;background:#27dbde;color:#16191d;border:1.5px solid #27dbde;border-radius:8px;padding:11px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:16px;font-weight:700;cursor:pointer;height:62px;">POTVRDIT ✓</button>' +
          '</div>' +
        '</div>' +
        '<div style="flex:0 0 320px;display:flex;flex-direction:column;gap:5px;height:100%;">' +
          '<div style="font-size:10px;color:#808080;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;text-align:center;flex-shrink:0;">Klávesnice</div>' +
          '<div id="fl-vpin-keys" style="flex:1;display:flex;flex-direction:column;min-height:0;"></div>' +
        '</div>' +
      '</div>';
    pushModal(overlay);

    var pinEl = overlay.querySelector('#fl-vpin');
    var msgEl = overlay.querySelector('#fl-vpin-msg');
    var keysEl = overlay.querySelector('#fl-vpin-keys');

    function refresh(){
      if (pinValue) pinEl.textContent = '•'.repeat(pinValue.length);
      else pinEl.innerHTML = '<span style="color:#808080;font-size:14px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-weight:500;letter-spacing:0;">PIN</span>';

    buildKeypad(keysEl, function(k){
      if (k === 'C') pinValue = '';
      else if (k === '⌫') pinValue = pinValue.slice(0, -1);
      else if (pinValue.length < 6) pinValue += k;

      render();

  /* ==========================================================
     MODÁL: PŘEDVOLBA MNOŽSTVÍ

     Obsluha si může před tankováním nastavit limit litrů.
     Když průtok dosáhne presetu, tankování se automaticky pozastaví.
     Quick-volby: 10, 20, 50, 100, 200, 500 L.
  ========================================================== */
  function openPresetModal(p){
    var overlay = makeOverlay();
    var quickValues = [10, 20, 50, 100, 200, 500];
    var powerIcon = '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg>';
    var xIcon = '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';
    var okIcon = '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M8.3 12.4l2.6 2.6 4.8-5.2"/></svg>';

    overlay.innerHTML =
      makeHeader(t('preset.title') + p.id + ' · max ' + p.limit + ' L') +
      '<div style="background:#16191d;border-radius:24px;height:100px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px;">' +
        '<div style="display:flex;flex-direction:column;justify-content:center;min-width:0;">' +
          '<span style="font-size:12px;color:#808080;font-weight:700;letter-spacing:1.5px;margin-bottom:2px;">VÝDEJ</span>' +
          '<div style="display:flex;align-items:baseline;gap:7px;"><span id="fl-preset-val" style="font-size:66px;color:#fff;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;">0,00</span><span style="font-size:38px;color:#e0ed07;font-weight:700;line-height:1;">L</span></div>' +
        '</div>' +
        '<span id="fl-preset-hint" style="font-size:18px;color:#808080;font-weight:600;white-space:nowrap;flex-shrink:0;">Žádná předvolba</span>' +
      '</div>' +
      '<div id="fl-preset-quick" style="display:flex;margin:14px -4px 0;flex-shrink:0;"></div>' +
      '<div class="fl-keys" style="flex:1;display:flex;flex-direction:column;min-height:0;margin-top:12px;"></div>' +
      '<div style="display:flex;margin:14px -5px 0;flex-shrink:0;">' +
        '<button id="fl-preset-clear" style="flex:1;margin:0 5px;background:#16191d;color:#e0ed07;border:1.5px solid #e0ed07;border-radius:20px;height:60px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;">' + powerIcon + '<span>VYPNOUT</span></button>' +
        '<button class="fl-cancel" style="flex:1;margin:0 5px;background:#16191d;color:#fd705c;border:1.5px solid #fd705c;border-radius:20px;height:60px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;">' + xIcon + '<span>CANCEL</span></button>' +
        '<button class="fl-ok" style="flex:1;margin:0 5px;background:#27dbde;color:#000000;border:none;border-radius:20px;height:60px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;">' + okIcon + '<span>ENTER</span></button>' +
      '</div>';
    pushModal(overlay);
    bindHeader(overlay);

    var value = p.preset !== null ? String(p.preset) : '';
    var valEl = overlay.querySelector('#fl-preset-val');
    var hintEl = overlay.querySelector('#fl-preset-hint');
    var quickEl = overlay.querySelector('#fl-preset-quick');
    var keysEl = overlay.querySelector('.fl-keys');

    function refresh(){
      valEl.textContent = value ? value : '0,00';
      hintEl.textContent = value ? ('do ' + p.limit + ' L') : 'Žádná předvolba';
      var kids = quickEl.children;
      for (var i = 0; i < kids.length; i++){
        var v = quickValues[i];
        var over = v > p.limit;
        var sel = (value !== '' && parseInt(value, 10) === v);
        kids[i].style.borderColor = sel ? '#e0ed07' : (over ? '#323232' : '#323232');
        kids[i].style.color = sel ? '#e0ed07' : (over ? '#808080' : '#e0ed07');
        kids[i].style.background = sel ? 'rgba(224,237,7,0.12)' : '#16191d';
      }
    }

    quickValues.forEach(function(v){
      var b = document.createElement('button');
      var over = v > p.limit;
      b.style.cssText = 'flex:1 1 0;min-width:0;margin:0 4px;height:38px;border-radius:19px;background:#16191d;border:1.5px solid #323232;color:#e0ed07;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:15px;font-weight:700;cursor:' + (over ? 'default' : 'pointer') + ';display:flex;align-items:center;justify-content:center;line-height:1;';
      b.textContent = v + ' L';
      if (!over){ b.onclick = function(){ value = String(v); refresh(); }; }
      quickEl.appendChild(b);
    });
    refresh();

    buildKeypad(keysEl, function(k){
      if (k === 'C') value = '';
      else if (k === '⌫') value = value.slice(0, -1);
      else if (value.length < 5) value += k;
      refresh();
    }, 26);

    overlay.querySelector('#fl-preset-clear').onclick = function(){ p.preset = null; popModal(); render(); };
    overlay.querySelector('.fl-cancel').onclick = popModal;
    overlay.querySelector('.fl-ok').onclick = function(){
      var n = value ? parseInt(value, 10) : null;
      if (n !== null && (n <= 0 || n > p.limit)) n = Math.min(p.limit, Math.max(1, n));
      p.preset = n;
      popModal(); render();
    };
  }

  /* ==========================================================
     MODÁL: POZNÁMKA
  ========================================================== */
  function openNoteModal(p){
    var overlay = makeOverlay();
    overlay.innerHTML =
      makeHeader(t('note.title') + p.id) +
      '<div id="fl-input" style="background:#16191d;border:1.5px solid #323232;border-radius:24px;padding:8px 22px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:24px;color:#ffffff;font-weight:600;min-height:54px;flex-shrink:0;display:flex;align-items:center;letter-spacing:0.3px;"></div>' +
      '<div class="fl-presets" style="display:flex;margin:10px -3px 0;flex-shrink:0;"></div>' +
      '<div class="fl-keys" style="flex:1;display:flex;flex-direction:column;margin:8px 0 0;min-height:0;"></div>' +
      '<div style="display:flex;margin:8px -5px 0;flex-shrink:0;">' +
        '<button class="fl-cancel" style="flex:1;margin:0 5px;background:#16191d;color:#fd705c;border:1.5px solid #fd705c;border-radius:20px;height:60px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg><span>CANCEL</span></button>' +
        '<button class="fl-ok" style="flex:1;margin:0 5px;background:#27dbde;color:#000000;border:none;border-radius:20px;height:60px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M8.3 12.4l2.6 2.6 4.8-5.2"/></svg><span>ENTER</span></button>' +
      '</div>';
    pushModal(overlay);
    bindHeader(overlay);

    var value = String(p.note || '');
    var inputEl = overlay.querySelector('#fl-input');
    var keysEl  = overlay.querySelector('.fl-keys');
    var presetsEl = overlay.querySelector('.fl-presets');
    function refresh(){
      if (value){ inputEl.textContent = value; }
      else { inputEl.innerHTML = '<span style="color:#808080;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:16px;font-weight:500;">Klepněte pro zadání nebo vyberte...</span>'; }
    }
    refresh();

    var presets = ['Servis', 'Údržba', 'Pole', 'Doprava', 'Odčerpání'];
    presets.forEach(function(t){
      var b = document.createElement('button');
      b.textContent = t;
      b.style.cssText = 'flex:1 1 0;min-width:0;margin:0 3px;background:#16191d;color:#808080;border:1.5px solid #323232;border-radius:21px;padding:0;height:42px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;';
      b.onclick = function(){ value = t; refresh(); };
      presetsEl.appendChild(b);
    });

    function mkKey(label, flexGrow, fontSize, color, onTap){
      var b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = 'flex:' + flexGrow + ' 1 0;min-width:0;margin:0 3px;background:#16191d;color:' + color +
        ';border:1.5px solid #323232;border-radius:16px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:' + fontSize +
        'px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;box-sizing:border-box;';
      b.onclick = onTap;
      return b;
    }
    function addChar(c){ if (value.length < 40) value += c; refresh(); }

    var keyRows = ['1234567890', 'QWERTYUIOP', 'ASDFGHJKLŮ', 'ZXCVBNM,.⌫'];
    keyRows.forEach(function(row){
      var rowEl = document.createElement('div');
      rowEl.style.cssText = 'flex:1 1 0;display:flex;margin:3px 0;min-height:0;';
      for (var i = 0; i < row.length; i++){
        (function(ch){
          var color = (ch === '⌫') ? '#e0ed07' : '#ffffff';
          rowEl.appendChild(mkKey(ch, 1, 26, color, function(){
            if (ch === '⌫') { value = value.slice(0, -1); refresh(); }
            else addChar(ch.toLowerCase());
          }));
        })(row[i]);
      }
      keysEl.appendChild(rowEl);
    });

    // spodní řada: CLEAR | velký MEZERNÍK
    var utilRow = document.createElement('div');
    utilRow.style.cssText = 'flex:1 1 0;display:flex;margin:3px 0;min-height:0;';
    utilRow.appendChild(mkKey('CLEAR', 1, 20, '#e0ed07', function(){ value = ''; refresh(); }));
    utilRow.appendChild(mkKey('␣  MEZERA', 3.4, 20, '#ffffff', function(){ addChar(' '); }));
    keysEl.appendChild(utilRow);

    overlay.querySelector('.fl-cancel').onclick = popModal;
    overlay.querySelector('.fl-ok').onclick = function(){ p.note = value; popModal(); render(); };
  }

  /* ==========================================================
     MODÁL: INFO (rozcestník)
  ========================================================== */
  // Přepínání zobrazovacích Info obrazovek tažením vlevo/vpravo
  var INFO_NAV = ['tank', 'tot', 'tx'];
  function infoOpen(which){
    if (which === 'tank') openTankLevels();
    else if (which === 'tot') openTotalizers();
    else openTransactions();
  }
  function infoSwitch(curIdx, dir){
    var n = INFO_NAV.length;
    var ni = (curIdx + dir + n) % n;
    popModal();
    infoOpen(INFO_NAV[ni]);
  }
  function infoNav(curIdx){
    return {
      left:  function(){ infoSwitch(curIdx, +1); },
      right: function(){ infoSwitch(curIdx, -1); }
    };
  }
  function openInfoModal(){
    var overlay = makeOverlay();
    var items = [
      { icon: 'tank',    label: 'Stavy hladin',       desc: 'Aktuální stav nádrží', action: openTankLevels },
      { icon: 'sigma',   label: 'Totalizéry',          desc: 'Souhrn po stojanech',  action: openTotalizers },
      { icon: 'truck',   label: 'Příjem paliva',       desc: 'Vyžaduje autorizaci',  action: openFuelIntake },
      { icon: 'history', label: 'Historie transakcí',  desc: 'Posledních 50',        action: openTransactions }

    overlay.innerHTML =

        '<div style="flex:1;min-width:0;font-size:22px;font-weight:700;color:#ffffff;">' + t('info.modal.title') + '</div>' +
        '<button class="fl-mod-close" style="width:46px;height:46px;border-radius:50%;background:#000000;border:1.5px solid #323232;color:#e0ed07;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M18 6L6 18M6 6l12 12"/></svg></button>' +
      '</div>' +
      '<div style="flex:1;display:flex;flex-direction:column;margin:-6px;min-height:0;">' +
        '<div style="display:flex;flex:1 1 0;min-height:0;">' + infoItem(items[0], 0) + infoItem(items[1], 1) + '</div>' +

      '</div>';

  function openTankLevels(){
    var overlay = makeOverlay();
    var rowsHtml = tanks.map(function(tnk){
      var pct = (tnk.level / tnk.capacity) * 100;
      var lowAlarm = tnk.level < tnk.alarmLow;
      var color = fuelColor(tnk.fuel);
      var alarmBg = lowAlarm ? '#3a2024' : '#1d2127';
      var alarmBd = lowAlarm ? '#d24f4f' : '#323232';
      return '<div style="background:' + alarmBg + ';border:1.5px solid ' + alarmBd + ';border-radius:10px;padding:16px 20px;display:flex;align-items:center;gap:20px;">' +
        '<div style="font-size:52px;font-weight:600;color:' + color + ';line-height:1;flex-shrink:0;width:64px;text-align:center;">' + tnk.id + '</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;">' +
            '<div><span style="font-size:24px;color:' + color + ';font-weight:700;">' + tnk.fuel + '</span>' + (lowAlarm ? '<span style="margin-left:12px;font-size:17px;color:#ff8888;font-weight:700;letter-spacing:0.5px;">⚠ NÍZKÁ HLADINA</span>' : '') + '</div>' +
            '<div style="font-size:34px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;">' + fmtInt(tnk.level) + ' / ' + fmtInt(tnk.capacity) + ' L</div>' +
          '</div>' +
          '<div style="height:19px;background:#16191d;border-radius:10px;overflow:hidden;">' +
            '<div style="height:100%;width:' + pct + '%;background:' + (lowAlarm ? '#ff8888' : color) + ';"></div>' +
          '</div>' +
          '<div style="display:flex;justify-content:space-between;font-size:17px;color:#808080;font-weight:500;margin-top:6px;">' +
            '<span>Alarm: ' + tnk.alarmLow + ' L</span>' +
            '<span>' + t('fi.lastDelivery') + ' ' + fmtDate(tnk.lastDelivery) + '</span>' +
            '<span>' + pct.toFixed(1) + ' %</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    overlay.innerHTML = makeHeader(t('info.tanks.title')) +
      '<div style="flex:1;display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0;">' + rowsHtml + '</div>';
    pushModal(overlay);
    bindHeader(overlay, null, infoNav(0));
  }

  function openTotalizers(){
    var overlay = makeOverlay();
    var rowsHtml = totalizers.map(function(t){
      var color = fuelColor(t.fuel);
      return '<div style="background:#1d2127;border:1.5px solid #323232;border-radius:10px;padding:16px 18px;">' +

  /* Modal pro zadání natankovaného množství (přírůstek) */
  function openFuelIntakeAdd(tank){
    var overlay = makeOverlay();
    var color = fuelColor(tank.fuel);
    var available = tank.capacity - tank.level;
    overlay.innerHTML =
      makeHeader(t('fi.add.title') + tank.id + ' · ' + tank.fuel) +
      '<div style="background:rgba(0,165,155,0.10);border:1.5px solid rgba(0,165,155,0.4);border-radius:10px;padding:10px 14px;margin-bottom:6px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;">' +
        '<div><span style="color:#808080;font-weight:600;">V nádrži:</span> <strong style="color:#fff;font-variant-numeric:tabular-nums;">' + fmtInt(tank.level) + ' L</strong></div>' +
        '<div><span style="color:#808080;font-weight:600;">Volná kapacita:</span> <strong style="color:#27dbde;font-variant-numeric:tabular-nums;">' + fmtInt(available) + ' L</strong></div>' +
        '<div><span style="color:#808080;font-weight:600;">Max:</span> <strong style="color:#fff;font-variant-numeric:tabular-nums;">' + fmtInt(tank.capacity) + ' L</strong></div>' +
      '</div>' +
      '<div id="fl-add-input" style="background:#16191d;border:2px solid #27dbde;border-radius:10px;padding:8px 22px;font-family:Satoshi, Menlo, Monaco, Consolas, monospace;font-size:56px;color:#fff;text-align:right;font-weight:700;height:84px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;letter-spacing:1px;"></div>' +
      '<div id="fl-add-msg" style="font-size:14px;color:#808080;font-weight:600;text-align:center;min-height:18px;line-height:1.2;flex-shrink:0;margin:4px 0;"></div>' +
      '<div class="fl-keys" style="flex:1;display:flex;flex-direction:column;min-height:0;"></div>' +
      '<div style="display:flex;margin:6px -3px 0;flex-shrink:0;">' +
        '<button class="fl-cancel" style="flex:1;margin:0 3px;background:rgba(212,79,79,0.2);color:#ff8888;border:1.5px solid rgba(212,79,79,0.55);border-radius:10px;padding:0;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:18px;font-weight:700;cursor:pointer;height:62px;">ZRUŠIT</button>' +
        '<button class="fl-ok" style="flex:2;margin:0 3px;background:#e0ed07;color:#000000;border:1.5px solid #e0ed07;border-radius:10px;padding:0;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:19px;font-weight:700;cursor:pointer;height:62px;">PŘIJMOUT ✓</button>' +
      '</div>';
    pushModal(overlay);
    bindHeader(overlay);

    var value = '';
    var inputEl = overlay.querySelector('#fl-add-input');
    var msgEl = overlay.querySelector('#fl-add-msg');
    var keysEl = overlay.querySelector('.fl-keys');

    function refresh(){
      if (value){
        inputEl.textContent = value + ' L';
        var n = parseInt(value);
        if (n + tank.level > tank.capacity){
          msgEl.textContent = '⚠ Po přidání by nádrž přesáhla kapacitu (' + (n + fmtInt(tank.level)) + ' L). Hodnota se omezí na ' + available + ' L.';
          msgEl.style.color = '#CB6015';
        } else if (n > 0){
          msgEl.textContent = 'Po přijetí: ' + (tank.level + fmtInt(n)) + ' L · ' + ((tank.level + n) / tank.capacity * 100).toFixed(1).replace('.',',') + ' %';
          msgEl.style.color = '#27dbde';
        } else {
          msgEl.textContent = '';
        }
      } else {
        inputEl.innerHTML = '<span style="color:#808080;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:18px;font-weight:500;letter-spacing:0;">— zadejte množství —</span>';
        msgEl.textContent = '';
      }
    }
    refresh();

    buildKeypad(keysEl, function(k){
      if (k === 'C') value = '';
      else if (k === '⌫') value = value.slice(0, -1);
      else if (value.length < 6) value += k;
      refresh();
    }, 58);

    overlay.querySelector('.fl-cancel').onclick = popModal;
    overlay.querySelector('.fl-ok').onclick = function(){
      var n = parseInt(value || '0');
      if (n <= 0){
        msgEl.textContent = '⚠ Zadejte kladné množství';
        msgEl.style.color = '#ff8888';
        return;
      }
      // Clamp na kapacitu
      var added = Math.min(n, available);
      tank.level += added;
      tank.lastDelivery = fmtDate(new Date());
      simLog('Příjem paliva: nádrž ' + tank.id + ' (' + tank.fuel + ') +' + added + ' L · ' + (currentSession ? currentSession.name : '-'), 'green');
      popModal();
      popModal();
      openFuelIntakeDetail();
    };
  }

  function openFuelIntakeTax(tank){
    var overlay = makeOverlay();
    var color = fuelColor(tank.fuel);
    var oldExciseTotal = tank.level * tank.excise;
    overlay.innerHTML =
      makeHeader(t('fi.tax.title') + tank.id + ' · ' + tank.fuel) +

        '<div><span style="color:#808080;font-weight:600;">Sazba:</span> <strong style="color:#fff;font-variant-numeric:tabular-nums;">' + tank.excise.toFixed(2).replace('.',',') + ' ' + currency() + '/L</strong></div>' +

      '</div>' +
      '<div id="fl-tax-input" style="background:#16191d;border:2px solid #CB6015;border-radius:10px;padding:8px 22px;font-family:Satoshi, Menlo, Monaco, Consolas, monospace;font-size:56px;color:#fff;text-align:right;font-weight:700;height:84px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;letter-spacing:1px;"></div>' +
      '<div id="fl-tax-msg" style="font-size:14px;color:#808080;font-weight:600;text-align:center;min-height:18px;line-height:1.2;flex-shrink:0;margin:4px 0;"></div>' +
      '<div class="fl-keys" style="flex:1;display:flex;flex-direction:column;min-height:0;"></div>' +
      '<div style="display:flex;margin:6px -3px 0;flex-shrink:0;">' +
        '<button class="fl-cancel" style="flex:1;margin:0 3px;background:rgba(212,79,79,0.2);color:#ff8888;border:1.5px solid rgba(212,79,79,0.55);border-radius:10px;padding:0;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:18px;font-weight:700;cursor:pointer;height:62px;">ZRUŠIT</button>' +
        '<button class="fl-ok" style="flex:2;margin:0 3px;background:#CB6015;color:#16191d;border:1.5px solid #CB6015;border-radius:10px;padding:0;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:19px;font-weight:700;cursor:pointer;height:62px;">ULOŽIT ✓</button>' +
      '</div>';
    pushModal(overlay);
    bindHeader(overlay);

    // hodnota jako string s desetinnou čárkou
    var value = tank.excise > 0 ? tank.excise.toFixed(2).replace('.', ',') : '';
    var inputEl = overlay.querySelector('#fl-tax-input');
    var msgEl = overlay.querySelector('#fl-tax-msg');
    var keysEl = overlay.querySelector('.fl-keys');

    function parseValue(){
      if (!value) return 0;
      return parseFloat(value.replace(',', '.')) || 0;
    }

    function refresh(){
      if (value){
        inputEl.textContent = value;
        var n = parseValue();
        var newTotal = tank.level * n;
        var diff = newTotal - oldExciseTotal;
        var diffSign = diff >= 0 ? '+' : '';
        var diffColor = diff >= 0 ? '#27dbde' : '#ff8888';
        if (n > 0){
          msgEl.innerHTML = 'Nová celková daň: <strong style="color:#CB6015;">' + fmtInt(Math.round(newTotal)) + ' ' + currency() + '</strong> · rozdíl <span style="color:' + diffColor + ';font-weight:700;">' + diffSign + fmtInt(Math.round(diff)) + ' ' + currency() + '</span>';
          msgEl.style.color = '#ffffff';
        } else if (n === 0){
          msgEl.textContent = t('fi.tax.zero');
          msgEl.style.color = '#808080';
        }
      } else {
        inputEl.innerHTML = '<span style="color:#808080;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:18px;font-weight:500;letter-spacing:0;">— zadejte sazbu —</span>';
        msgEl.textContent = '';
      }
    }
    refresh();

    buildKeypad(keysEl, function(k){
      if (k === 'C') value = '';
      else if (k === '⌫') value = value.slice(0, -1);
      else if (k === '0' && !value) value = '0,';
      else if (value.length < 7){
        if (value.indexOf(',') >= 0){
          var afterComma = value.split(',')[1] || '';
          if (afterComma.length >= 2) return;
        }
        value += k;
        if (value.length === 2 && value.indexOf(',') < 0) value += ',';
      }
      refresh();
    }, 58);

    overlay.querySelector('.fl-cancel').onclick = popModal;
    overlay.querySelector('.fl-ok').onclick = function(){
      var n = parseValue();
      if (n < 0){
        msgEl.textContent = '⚠ Sazba nemůže být záporná';
        msgEl.style.color = '#ff8888';
        return;
      }
      var oldExcise = tank.excise;
      tank.excise = n;
      simLog('Příjem paliva: nádrž ' + tank.id + ' (' + tank.fuel + ') · změna sazby ' + oldExcise.toFixed(2) + ' → ' + n.toFixed(2) + ' Kč/L · ' + (currentSession ? currentSession.name : '-'), 'orange');
      popModal();
      popModal();
      openFuelIntakeDetail();
    };
  }
