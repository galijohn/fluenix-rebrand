  /* ==========================================================
     MODÁL: LOGIN PRO NASTAVENÍ

     Přihlášení vyžaduje:
       1. Jméno uživatele - ručně přes QWERTY klávesnici NEBO
          přiložením klíčenky řidiče (auto-fill ze seznamu)
       2. PIN - výchozí 1234 pro každého

     Role (do budoucna):
       - 'customer' (Zákazník) - omezené nastavení
       - 'admin'   (Admin)     - plný přístup
     Zatím každý řidič má roli 'customer', technik 'admin'.
  ========================================================== */
  var USER_PIN_DEFAULT = '1234';

  /* Role mapping:
     - 'dealer-admin'  → Dealer admin (nejvyšší práva)
     - 'admin'         → Standard admin (servisní technik)
     - 'customer'      → Zákazník (omezené)
     V testu: Novák = dealer-admin, ostatní řidiči = admin */
  var loginRoles = {
    'Tomáš Beneš':  'superadmin',
    'Jan Novák':    'dealer-admin',
    'Petr Svoboda': 'admin',
    'Karel Dvořák': 'admin',
    'Marie Krátká': 'admin'
  };
  var currentSession = null; // {name, role, since} po úspěšném loginu

  function roleLabel(role){
    if (role === 'superadmin')   return 'SUPERADMIN';
    if (role === 'dealer-admin') return 'DEALER ADMIN';
    if (role === 'admin')        return 'ADMIN';
    return 'ZÁKAZNÍK';
  }
  function roleColor(role){
    // SuperAdmin: fialová (výrazně mimo brand paletu pro nejvyšší úroveň)
    if (role === 'superadmin')   return { fg: '#a070d4', bg: 'rgba(160,112,212,0.18)', bd: 'rgba(160,112,212,0.4)' };
    if (role === 'dealer-admin') return { fg: '#CB6015', bg: 'rgba(203,96,21,0.18)', bd: 'rgba(203,96,21,0.4)' };
    if (role === 'admin')        return { fg: '#ff8888', bg: 'rgba(212,79,79,0.18)', bd: 'rgba(212,79,79,0.4)' };
    return { fg: '#27dbde', bg: 'rgba(0,165,155,0.15)', bd: 'rgba(0,165,155,0.4)' };
  }

  /* afterLogin callback je volitelný — pokud není zadán, otevře se Settings.
     skipPin: pokud true, po výběru uživatele se rovnou zavolá afterLogin
     bez druhého kroku (zadání hesla). Používá se např. pro Příjem paliva,
     kde stačí jen přiložení klíčenky (autentizace 1FA = RFID). */
  /* ==========================================================
     LOGIN DO NASTAVENÍ — nový jednoduchý 2-krokový flow

     Krok 1: Přilož klíčenku (jen výzva, žádný seznam)
       - velká pulzující ikona + "PŘILOŽTE KLÍČENKU"
       - v demo režimu skryté quick-pick klíčenky pro simulaci

     Krok 2: Alfanumerické heslo
       - QWERTY klávesnice + horní řada čísel
       - SHIFT pro malá/velká písmena
       - po správném hesle: callback (nebo Settings menu)

     afterLogin callback je volitelný — pokud není zadán, otevře se Settings.
     opts.skipPin (legacy) → 1FA, jen klíčenka. Používá Příjem paliva
     (i když ten teď používá vlastní openFuelIntakeAuth).
  ========================================================== */
  function openSettingsLogin(afterLogin, opts){
    opts = opts || {};
    if (opts.skipPin){
      // Legacy 1FA — jen výběr uživatele bez hesla
      openLoginStep1(null, afterLogin, opts);
      return;
    }
    // Standardní 2FA: klíčenka → heslo
    openSettingsLoginRfid(afterLogin);
  }

      b.innerHTML =
        '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="' + rc.fg + '" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>' +
        '<div style="font-size:16px;font-weight:700;color:#fff;text-align:center;">' + d.name + '</div>' +
        '<div style="font-size:11px;color:#808080;font-family:Satoshi, Menlo, Monaco, Consolas, monospace;font-weight:500;">' + d.id + '</div>' +
        '<div style="background:' + rc.bg + ';color:' + rc.fg + ';border:1px solid ' + rc.bd + ';border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700;letter-spacing:0.3px;margin-top:2px;">' + roleLabel(role) + '</div>';
      b.onclick = function(){
        simLog('Přihlášení do nastavení: klíčenka načtena · ' + d.name + ' (' + roleLabel(role) + ')', 'orange');
        popModal();
        openSettingsLoginPassword({ name: d.name, id: d.id, role: role }, afterLogin);
      };

    overlay.querySelector('.fl-cancel').onclick = popModal;

  /* KROK 2 — Alfanumerické heslo */
  function openSettingsLoginPassword(user, afterLogin){

    var rc = roleColor(user.role);

    overlay.innerHTML =
      makeHeader(t('login.title2')) +
      '<div style="display:flex;margin:0 -3px 6px;flex-shrink:0;">' +
        '<div style="flex:1;margin:0 3px;height:5px;background:#27dbde;border-radius:3px;"></div>' +
        '<div style="flex:1;margin:0 3px;height:5px;background:#CB6015;border-radius:3px;"></div>' +
      '</div>' +
      '<div style="background:#16191d;border:1.5px solid #323232;border-radius:10px;padding:7px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;">' +
        '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="' + rc.fg + '" stroke-width="2.2" style="flex-shrink:0;"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>' +
        '<div style="flex:1;min-width:0;font-size:16px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + user.name + '</div>' +
        '<div style="background:' + rc.bg + ';color:' + rc.fg + ';border:1px solid ' + rc.bd + ';border-radius:6px;padding:3px 9px;font-size:12px;font-weight:700;letter-spacing:0.4px;flex-shrink:0;">' + roleLabel(user.role) + '</div>' +
        '<button id="fl-back-rfid" style="background:transparent;color:#808080;border:1.5px solid #323232;border-radius:8px;width:48px;height:48px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;">' +
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>' +
        '</button>' +
      '</div>' +
      '<div id="fl-pw-display" style="background:#16191d;border:2px solid #CB6015;border-radius:10px;padding:8px 14px;font-family:Satoshi, Menlo, Monaco, Consolas, monospace;font-size:30px;color:#fff;font-weight:700;height:50px;display:flex;align-items:center;letter-spacing:8px;flex-shrink:0;margin-top:6px;"></div>' +
      '<div id="fl-pw-keyboard" style="flex:1;display:flex;flex-direction:column;min-height:0;margin-top:6px;"></div>' +
      '<div style="display:flex;margin:6px -3px 0;flex-shrink:0;">' +
        '<button class="fl-cancel" style="flex:1;margin:0 3px;background:rgba(212,79,79,0.2);color:#ff8888;border:1.5px solid rgba(212,79,79,0.55);border-radius:10px;padding:0;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:18px;font-weight:700;cursor:pointer;height:62px;">ZRUŠIT</button>' +
        '<button class="fl-ok" style="flex:2;margin:0 3px;background:#e0ed07;color:#000000;border:1.5px solid #e0ed07;border-radius:10px;padding:0;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:19px;font-weight:700;cursor:pointer;height:62px;">PŘIHLÁSIT ✓</button>' +
      '</div>' +
      '<div id="fl-pw-msg" style="font-size:12px;color:#808080;font-weight:600;text-align:center;line-height:1.2;flex-shrink:0;margin-top:4px;">Výchozí heslo pro testy: <strong>1234</strong></div>';

    pushModal(overlay);
    bindHeader(overlay);

    var pwValue = '';
    var shiftOn = false;
    var symbolsOn = false;
    var pwEl = overlay.querySelector('#fl-pw-display');
    var msgEl = overlay.querySelector('#fl-pw-msg');
    var kbEl = overlay.querySelector('#fl-pw-keyboard');

    function refresh(){
      if (pwValue){
        pwEl.textContent = '•'.repeat(pwValue.length);
      } else {
        pwEl.innerHTML = '<span style="color:#808080;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:14px;font-weight:500;letter-spacing:0;">zadejte heslo</span>';
      }
      renderKeyboard();
    }

    function renderKeyboard(){
      kbEl.innerHTML = '';
      var rows;
      if (symbolsOn){
        rows = [
          ['1','2','3','4','5','6','7','8','9','0'],
          ['!','@','#','$','%','&','*','-','+','='],
          ['(',')','[',']','{','}','/','?',':',';'],
          ['ABC','.',',','_','\'','"','⌫']
        ];
      } else {
        var letters1 = shiftOn ? 'QWERTYUIOP' : 'qwertyuiop';
        var letters2 = shiftOn ? 'ASDFGHJKLŮ' : 'asdfghjklů';
        var letters3 = shiftOn ? 'ZXCVBNM' : 'zxcvbnm';
        rows = [
          ['1','2','3','4','5','6','7','8','9','0'],
          letters1.split(''),
          letters2.split(''),
          ['⇧'].concat(letters3.split('')).concat(['⌫']),
          ['?123','␣','.','-']
        ];
      }

      rows.forEach(function(row){
        var rowEl = document.createElement('div');
        rowEl.style.cssText = 'flex:1 1 0;display:flex;margin:3px 0;min-height:0;';
        row.forEach(function(ch){
          var b = document.createElement('button');
          var isControl = (ch === '⇧' || ch === '⌫' || ch === '?123' || ch === 'ABC' || ch === '␣');
          var col = isControl ? '#CB6015' : '#ffffff';
          var bg = (ch === '⇧' && shiftOn) ? 'rgba(203,96,21,0.25)' : 'linear-gradient(180deg,#1d2127,#181c20)';

          var flexGrow = '1';
          if (ch === '⇧' || ch === '⌫' || ch === '?123' || ch === 'ABC') flexGrow = '1.5';
          if (ch === '␣') flexGrow = '6';

          var fontSize = isControl ? (ch === '?123' || ch === 'ABC' ? 16 : 22) : 24;
          if (ch === '␣') fontSize = 18;

          b.textContent = (ch === '␣') ? '␣  MEZERA' : ch;
          b.style.cssText = 'flex:' + flexGrow + ' 1 0;min-width:0;margin:0 3px;background:' + bg + ';color:' + col +
            ';border:1.5px solid #323232;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,0.25),inset 0 1px 0 rgba(255,255,255,0.05);font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:' + fontSize +
            'px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;box-sizing:border-box;';

          (function(c){
            b.onclick = function(){
              if (c === '⇧'){ shiftOn = !shiftOn; refresh(); }
              else if (c === '⌫'){ pwValue = pwValue.slice(0, -1); refresh(); }
              else if (c === '?123'){ symbolsOn = true; refresh(); }
              else if (c === 'ABC'){ symbolsOn = false; refresh(); }
              else if (c === '␣'){ if (pwValue.length < 32) pwValue += ' '; refresh(); }
              else {
                if (pwValue.length < 32) pwValue += c;
                if (shiftOn && /[A-Z]/.test(c)) shiftOn = false;
                refresh();
              }
            };
          })(ch);
          rowEl.appendChild(b);
        });
        kbEl.appendChild(rowEl);
      });
    }

    refresh();

    overlay.querySelector('#fl-back-rfid').onclick = function(){
      popModal();
      openSettingsLoginRfid(afterLogin);
    };
    overlay.querySelector('.fl-cancel').onclick = popModal;
    overlay.querySelector('.fl-ok').onclick = function(){
      // Pro testy: heslo "1234" stejně jako dosud (USER_PIN_DEFAULT)
      if (pwValue !== USER_PIN_DEFAULT){
        msgEl.textContent = t('login.wrongPwd');
        msgEl.style.color = '#ff8888';
        pwValue = '';
        refresh();
        return;
      }
      currentSession = { name: user.name, role: user.role, since: Date.now() };
      msgEl.textContent = '✓ Přihlášen jako ' + roleLabel(user.role);
      msgEl.style.color = '#27dbde';
      simLog('Nastavení: úspěšné přihlášení · ' + user.name + ' (' + roleLabel(user.role) + ')', 'green');
      setTimeout(function(){
        popModal();
        if (typeof afterLogin === 'function') afterLogin();
        else openSettingsModal();
      }, 500);
    };
  }

  /* ==========================================================
     KROK 1 – Výběr uživatele
     - filter / search přes QWERTY klávesnici
     - klepnutím na řádek nebo přiložením RFID se zvolí
     - po výběru se otevře KROK 2 (heslo) — POKUD opts.skipPin === true,
       rovnou se zavolá afterLogin
  ========================================================== */
  function openLoginStep1(prefilledName, afterLogin, opts){
    opts = opts || {};
    var skipPin = !!opts.skipPin;
    var overlay = makeOverlay();
    overlay.innerHTML =
      makeHeader(skipPin ? 'Přiložte klíčenku obsluhy' : 'Přihlášení · 1/2 · Vyberte uživatele') +

      // STEP INDICATOR (jen pokud má následovat krok 2)
      (skipPin ? '' :
        '<div style="display:flex;gap:5px;margin-bottom:8px;flex-shrink:0;">' +
          '<div style="flex:1;height:4px;background:#CB6015;border-radius:2px;"></div>' +
          '<div style="flex:1;height:4px;background:#323232;border-radius:2px;"></div>' +
        '</div>'
      ) +

      '<div style="flex:1;display:flex;gap:8px;min-height:0;">' +

        // LEVÝ SLOUPEC: search input + seznam uživatelů
        '<div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;">' +
          '<div style="display:flex;flex-direction:column;gap:3px;flex-shrink:0;">' +
            '<label style="font-size:9px;color:#808080;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;">Hledat / zadat jméno</label>' +
            '<div id="fl-login-search" style="background:#16191d;border:2px solid #CB6015;border-radius:7px;padding:8px 12px;font-family:Satoshi, Menlo, Monaco, Consolas, monospace;font-size:18px;color:#fff;font-weight:700;height:42px;display:flex;align-items:center;letter-spacing:0.5px;"></div>' +
          '</div>' +

          '<div style="display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;">' +
            '<label style="font-size:9px;color:#808080;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;flex-shrink:0;">Uživatelé · klepněte pro výběr</label>' +
            '<div id="fl-login-list" style="flex:1;display:flex;flex-direction:column;gap:3px;overflow-y:auto;min-height:0;padding-right:2px;"></div>' +
          '</div>' +
        '</div>' +

        // PRAVÝ SLOUPEC: RFID + klávesnice
        '<div style="flex:0 0 220px;display:flex;flex-direction:column;gap:5px;">' +
          '<div style="background:rgba(203,96,21,0.10);border:1.5px dashed rgba(203,96,21,0.5);border-radius:7px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;">' +
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CB6015" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="8" cy="12" r="2"/><path d="M14 10h5M14 14h3"/></svg>' +
            '<div style="font-size:11px;color:#CB6015;font-weight:700;letter-spacing:0.4px;text-align:center;">PŘILOŽTE KLÍČENKU</div>' +
            '<div style="font-size:9px;color:#808080;font-weight:600;text-align:center;line-height:1.2;">simulace v demo režimu:</div>' +
            '<div id="fl-login-rfid-quick" style="display:grid;grid-template-columns:1fr 1fr;gap:3px;width:100%;"></div>' +
          '</div>' +

          '<div id="fl-login-qwerty" style="flex:1;display:flex;flex-direction:column;gap:3px;min-height:0;"></div>' +

          '<button class="fl-cancel" style="background:rgba(212,79,79,0.2);color:#ff8888;border:1.5px solid rgba(212,79,79,0.55);border-radius:7px;padding:9px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:13px;font-weight:700;cursor:pointer;height:46px;flex-shrink:0;">CANCEL</button>' +
        '</div>' +
      '</div>';

    pushModal(overlay);
    bindHeader(overlay);

    var search = prefilledName || '';
    var searchEl = overlay.querySelector('#fl-login-search');
    var listEl = overlay.querySelector('#fl-login-list');
    var qwEl = overlay.querySelector('#fl-login-qwerty');
    var rfidEl = overlay.querySelector('#fl-login-rfid-quick');

    function refresh(){
      if (search){
        searchEl.textContent = search;
        searchEl.style.color = '#fff';
      } else {
        searchEl.innerHTML = '<span style="color:#808080;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:13px;font-weight:500;letter-spacing:0;">— začněte psát pro filtrování seznamu —</span>';
      }
      renderList();
    }

    function renderList(){
      listEl.innerHTML = '';
      var q = search.toLowerCase().trim();
      var matches = demoDrivers.filter(function(d){
        if (!q) return true;
        return d.name.toLowerCase().indexOf(q) >= 0 || d.id.toLowerCase().indexOf(q) >= 0;
      });

      if (matches.length === 0){
        // Možnost vytvořit / použít vlastní jméno
        if (search.trim()){
          var customRow = document.createElement('button');
          customRow.style.cssText = 'background:rgba(0,165,155,0.10);color:#ffffff;border:1.5px dashed rgba(0,165,155,0.4);border-radius:7px;padding:10px 12px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;';
          customRow.innerHTML =
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#27dbde" stroke-width="2" style="flex-shrink:0;"><path d="M12 5v14M5 12h14"/></svg>' +
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-weight:700;color:#27dbde;">Použít "' + search.trim() + '"</div>' +
              '<div style="font-size:10px;color:#808080;font-weight:500;">vlastní uživatel mimo seznam</div>' +
            '</div>';
          customRow.onclick = function(){ chooseUser({ name: search.trim(), id: 'CUSTOM', custom: true }); };
          listEl.appendChild(customRow);
        } else {
          listEl.innerHTML = '<div style="color:#808080;font-size:11px;text-align:center;padding:20px;font-style:italic;">žádní uživatelé</div>';
        }
        return;
      }

      matches.forEach(function(d){
        var role = loginRoles[d.name] || 'customer';
        var rc = roleColor(role);
        var row = document.createElement('button');
        row.style.cssText = 'background:#1d2127;color:#ffffff;border:1.5px solid #323232;border-radius:7px;padding:8px 12px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;transition:all 0.12s;';
        row.onmouseenter = function(){ row.style.borderColor = '#CB6015'; };
        row.onmouseleave = function(){ row.style.borderColor = '#323232'; };
        row.innerHTML =
          '<div style="width:32px;height:32px;background:#16191d;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="' + rc.fg + '" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>' +
          '</div>' +
          '<div style="flex:1;min-width:0;">' +
            '<div style="font-size:13px;font-weight:700;color:#fff;">' + highlightMatch(d.name, q) + '</div>' +
            '<div style="font-size:10px;color:#808080;font-family:Satoshi, Menlo, Monaco, Consolas, monospace;font-weight:500;">' + d.id + '</div>' +
          '</div>' +
          '<div style="background:' + rc.bg + ';color:' + rc.fg + ';border:1px solid ' + rc.bd + ';border-radius:5px;padding:3px 7px;font-size:9px;font-weight:700;letter-spacing:0.4px;flex-shrink:0;">' + roleLabel(role) + '</div>';
        row.onclick = function(){ chooseUser(d); };
        listEl.appendChild(row);
      });
    }

    function highlightMatch(text, q){
      if (!q) return text;
      var idx = text.toLowerCase().indexOf(q);
      if (idx < 0) return text;
      return text.slice(0, idx) +
        '<span style="background:rgba(203,96,21,0.3);color:#CB6015;padding:0 2px;border-radius:2px;">' + text.slice(idx, idx + q.length) + '</span>' +
        text.slice(idx + q.length);
    }

    function chooseUser(d){
      var role = loginRoles[d.name] || (d.custom ? 'customer' : 'customer');
      if (skipPin){
        // 1FA režim: po výběru uživatele rovnou zalogovat
        currentSession = { name: d.name, role: role, since: Date.now() };
        simLog('Přihlášen: ' + d.name + ' (' + roleLabel(role) + ') · 1FA · klíčenka', 'green');
        popModal();
        if (typeof afterLogin === 'function') afterLogin();
      } else {
        popModal();
        openLoginStep2({ name: d.name, id: d.id, role: role }, afterLogin);
      }
    }

    // Quick RFID buttons (top right)
    demoDrivers.forEach(function(d){
      var b = document.createElement('button');
      b.style.cssText = 'background:#16191d;color:#ffffff;border:1.5px solid #323232;border-radius:5px;padding:5px 4px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:9px;font-weight:700;cursor:pointer;line-height:1.1;text-align:center;';
      b.innerHTML = '<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + d.name.split(' ').pop() + '</div><div style="font-size:8px;color:#808080;font-family:Satoshi, Menlo, Monaco, Consolas, monospace;font-weight:500;">' + d.id + '</div>';
      b.onclick = function(){ chooseUser(d); };
      rfidEl.appendChild(b);
    });

    // QWERTY klávesnice (filtruje seznam)
    var rows = ['1234567890', 'QWERTYUIOP', 'ASDFGHJKLŮ', 'ZXCVBNM⌫'];
    rows.forEach(function(row){
      var rowEl = document.createElement('div');
      rowEl.style.cssText = 'flex:1;display:grid;grid-template-columns:repeat(' + row.length + ',1fr);gap:2px;min-height:0;';
      for (var i = 0; i < row.length; i++){
        var ch = row[i];
        var b = document.createElement('button');
        b.textContent = ch;
        var color = (ch === '⌫') ? '#CB6015' : '#ffffff';
        b.style.cssText = 'background:#1d2127;color:' + color + ';border:1.5px solid #323232;border-radius:5px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:14px;font-weight:700;cursor:pointer;padding:0;';
        (function(c){
          b.onclick = function(){
            if (c === '⌫') search = search.slice(0, -1);
            else if (search.length < 20) search += c;
            refresh();
          };
        })(ch);
        rowEl.appendChild(b);
      }
      qwEl.appendChild(rowEl);
    });
    var spaceRow = document.createElement('div');
    spaceRow.style.cssText = 'display:flex;gap:2px;flex-shrink:0;';
    var sp = document.createElement('button');
    sp.textContent = '␣ MEZERA';
    sp.style.cssText = 'flex:1;background:#1d2127;color:#ffffff;border:1.5px solid #323232;border-radius:5px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:11px;font-weight:700;cursor:pointer;padding:5px 0;';
    sp.onclick = function(){ if (search.length < 20) search += ' '; refresh(); };
    var clr = document.createElement('button');
    clr.textContent = 'CLEAR';
    clr.style.cssText = 'flex:0 0 70px;background:#1d2127;color:#CB6015;border:1.5px solid #323232;border-radius:5px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:11px;font-weight:700;cursor:pointer;padding:5px 0;';
    clr.onclick = function(){ search = ''; refresh(); };
    spaceRow.appendChild(sp);
    spaceRow.appendChild(clr);
    qwEl.appendChild(spaceRow);

    overlay.querySelector('.fl-cancel').onclick = popModal;

    refresh();
  }

  /* ==========================================================
     KROK 2 – Zadání hesla
  ========================================================== */
  function openLoginStep2(user, afterLogin){
    var overlay = makeOverlay();
    var rc = roleColor(user.role);

    overlay.innerHTML =
      makeHeader('Přihlášení · 2/2 · Zadejte heslo') +

      '<div style="display:flex;gap:5px;margin-bottom:8px;flex-shrink:0;">' +
        '<div style="flex:1;height:4px;background:#27dbde;border-radius:2px;"></div>' +
        '<div style="flex:1;height:4px;background:#CB6015;border-radius:2px;"></div>' +
      '</div>' +

      '<div style="flex:1;display:flex;gap:8px;min-height:0;align-items:center;">' +

        // LEVÝ SLOUPEC: info o zvoleném uživateli + PIN field
        '<div style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;">' +

          // Info karta
          '<div style="background:#1d2127;border:1.5px solid #323232;border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px;">' +
            '<div style="width:48px;height:48px;background:#16191d;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">' +
              '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="' + rc.fg + '" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>' +
            '</div>' +
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-size:9px;color:#808080;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;">Uživatel</div>' +
              '<div style="font-size:16px;color:#fff;font-weight:700;line-height:1.1;">' + user.name + '</div>' +
              '<div style="font-size:10px;color:#808080;font-family:Satoshi, Menlo, Monaco, Consolas, monospace;font-weight:500;margin-top:1px;">' + user.id + '</div>' +
            '</div>' +
            '<div style="background:' + rc.bg + ';color:' + rc.fg + ';border:1px solid ' + rc.bd + ';border-radius:6px;padding:5px 9px;font-size:10px;font-weight:700;letter-spacing:0.4px;flex-shrink:0;">' + roleLabel(user.role) + '</div>' +
          '</div>' +

          '<button id="fl-back-step1" style="background:transparent;color:#808080;border:1px solid #323232;border-radius:6px;padding:7px 12px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:11px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;width:fit-content;">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>' +
            '<span>Změnit uživatele</span>' +
          '</button>' +

          // PIN field
          '<div style="display:flex;flex-direction:column;gap:3px;margin-top:auto;">' +
            '<label style="font-size:9px;color:#808080;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;">Heslo</label>' +
            '<div id="fl-login-pin" style="background:#16191d;border:2px solid #CB6015;border-radius:8px;padding:14px;font-family:Satoshi, Menlo, Monaco, Consolas, monospace;font-size:36px;color:#fff;text-align:center;font-weight:700;letter-spacing:18px;height:64px;display:flex;align-items:center;justify-content:center;"></div>' +
          '</div>' +

          '<div id="fl-login-msg" style="font-size:11px;color:#808080;font-weight:600;text-align:center;min-height:14px;line-height:1.2;">Výchozí heslo: <strong>1234</strong></div>' +

          '<div style="display:grid;grid-template-columns:1fr 2fr;gap:6px;flex-shrink:0;">' +
            '<button class="fl-cancel" style="background:rgba(212,79,79,0.2);color:#ff8888;border:1.5px solid rgba(212,79,79,0.55);border-radius:7px;padding:11px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:13px;font-weight:700;cursor:pointer;height:50px;">CANCEL</button>' +
            '<button class="fl-ok" style="background:#27dbde;color:#16191d;border:1.5px solid #27dbde;border-radius:7px;padding:11px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:14px;font-weight:700;cursor:pointer;height:50px;">PŘIHLÁSIT ✓</button>' +
          '</div>' +
        '</div>' +

        // PRAVÝ SLOUPEC: numerická klávesnice
        '<div style="flex:0 0 220px;display:flex;flex-direction:column;gap:5px;height:100%;">' +
          '<div style="font-size:10px;color:#808080;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;text-align:center;flex-shrink:0;">Klávesnice</div>' +
          '<div id="fl-login-keys" style="flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:4px;min-height:0;"></div>' +
        '</div>' +
      '</div>';

    pushModal(overlay);
    bindHeader(overlay);

    var pinValue = '';
    var pinEl = overlay.querySelector('#fl-login-pin');
    var msgEl = overlay.querySelector('#fl-login-msg');
    var keysEl = overlay.querySelector('#fl-login-keys');

    function refresh(){
      if (pinValue){
        pinEl.textContent = '•'.repeat(pinValue.length);
      } else {
        pinEl.innerHTML = '<span style="color:#808080;font-size:14px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-weight:500;letter-spacing:0;">zadejte heslo</span>';
      }
    }
    refresh();

    buildKeypad(keysEl, function(k){
      if (k === 'C') pinValue = '';
      else if (k === '⌫') pinValue = pinValue.slice(0, -1);
      else if (pinValue.length < 6) pinValue += k;
      refresh();
    }, 56);

    overlay.querySelector('#fl-back-step1').onclick = function(){
      popModal();
      openLoginStep1(user.name, afterLogin);
    };
    overlay.querySelector('.fl-cancel').onclick = popModal;
    overlay.querySelector('.fl-ok').onclick = function(){
      if (pinValue !== USER_PIN_DEFAULT){
        msgEl.textContent = t('login.wrongPwd');
        msgEl.style.color = '#ff8888';
        pinValue = '';
        refresh();
        return;
      }
      currentSession = { name: user.name, role: user.role, since: Date.now() };
      msgEl.textContent = '✓ Přihlášen jako ' + roleLabel(user.role);
      msgEl.style.color = '#27dbde';
      setTimeout(function(){
        popModal();
        if (typeof afterLogin === 'function') afterLogin();
        else openSettingsModal();
      }, 500);
    };
  }


  /* ==========================================================
     MODÁL: NASTAVENÍ
  ========================================================== */
  function openSettingsModal(){
    var overlay = makeOverlay();
    var role = currentSession ? currentSession.role : 'customer';
    var isAdmin = role === 'admin' || role === 'dealer-admin' || role === 'superadmin';
    var isDealerAdmin = role === 'dealer-admin' || role === 'superadmin';
    var isSuperAdmin = role === 'superadmin';
    var activePump = pumps.find(function(x){ return x.id === activeTab; }) || pumps[0];

    // Customer (Zákazník) - omezené nastavení
    var customerItems = [
      { icon: 'pistol', label: 'Aktivace pistole',     desc: 'Manuální start',         action: openPistolActivation },
      { icon: 'bell',   label: 'Alarm nízké hladiny',  desc: 'Notifikace',             action: openLowLevelAlarm, toggle: true, on: true },
      { icon: 'more',   label: 'Další...',             desc: 'Datum, jazyk, síť',     action: openMore }
    ];
    // Admin items - Nouzový režim reflektuje aktuální stav stojanu
    var adminItems = [
      { icon: 'wrench', label: 'Kalibrace stojanu',    desc: 'Průtokoměr',             action: openCalibration },
      { icon: 'alert',  label: 'Nouzový režim',        desc: 'Bypass · Stojan ' + activePump.id, action: openEmergencyMode, toggle: true, on: activePump.bypass, adminOnly: true },
      { icon: 'ruler',  label: 'Autokalibrace nádrže', desc: 'Sondy',                  action: openTankCalibration }
    ];
    // Dealer admin items (navíc oproti adminovi)
    var dealerItems = [
      { icon: 'tank',   label: 'Konfigurace stojanů',  desc: 'Přidat / odebrat',       action: openCalibration, dealerOnly: true },
      { icon: 'sigma',  label: 'Reset totalizérů',     desc: 'Vynulovat počítadla',    action: openCalibration, dealerOnly: true },
      { icon: 'wrench', label: 'Servisní mód',         desc: 'Diagnostika HW',         action: openCalibration, toggle: true, on: false, dealerOnly: true }
    ];
    // SuperAdmin items (úplně nejvyšší úroveň)
    var superItems = [
      { icon: 'user',    label: 'Správa uživatelů',    desc: 'Role, klíčenky, hesla',  action: openCalibration, superOnly: true },
      { icon: 'truck',   label: 'Správa vozidel',      desc: 'SPZ, RFID, pravidla',    action: openCalibration, superOnly: true },
      { icon: 'history', label: 'Audit log',           desc: 'Kdo co kdy udělal',      action: openCalibration, superOnly: true }
    ];

    var items;
    if (isSuperAdmin){
      items = customerItems.slice(0,1).concat(adminItems).concat(dealerItems).concat(superItems).concat(customerItems.slice(1));
    } else if (isDealerAdmin){
      items = customerItems.slice(0,1).concat(adminItems).concat(dealerItems).concat(customerItems.slice(1));
    } else if (isAdmin){
      items = customerItems.slice(0,1).concat(adminItems).concat(customerItems.slice(1));
    } else {
      items = customerItems;
    }

    var rc = roleColor(role);
    var sessionInfo = currentSession
      ? '<div style="display:flex;align-items:center;gap:8px;background:#1d2127;border:1px solid #323232;border-radius:7px;padding:6px 10px;margin-bottom:8px;flex-shrink:0;">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#27dbde" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>' +
          '<span style="font-size:11px;color:#808080;font-weight:600;">Přihlášen:</span>' +
          '<span style="font-size:12px;color:#ffffff;font-weight:700;">' + currentSession.name + '</span>' +
          '<span style="background:' + rc.bg + ';color:' + rc.fg + ';border:1px solid ' + rc.bd + ';border-radius:5px;padding:2px 7px;font-size:10px;font-weight:700;letter-spacing:0.4px;">' + roleLabel(role) + '</span>' +
          '<button id="fl-logout" style="margin-left:auto;background:rgba(212,79,79,0.15);color:#ff8888;border:1px solid rgba(212,79,79,0.4);border-radius:5px;padding:4px 10px;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:0.4px;">ODHLÁSIT</button>' +
        '</div>'
      : '';

    // Grid columns - dealer-admin má víc položek, takže 4 sloupce
    var gridCols = isDealerAdmin ? '1fr 1fr 1fr 1fr' : '1fr 1fr 1fr';

    overlay.innerHTML =
      makeHeader(t('settings.title')) +

  function setPumpCount(n){
    Object.keys(tickers).forEach(function(k){ clearInterval(tickers[k]); });

    settings.pumpCount = n;
    pumps = allPumps.slice(0, n);
    activeTab = pumps[0].id;
    selectedDriverIdx = 0;

    pumps.forEach(function(p){ if (p.flow) startTicker(p); });
    document.querySelectorAll('.pump-btn').forEach(function(b){
      var bn = parseInt(b.getAttribute('data-count'));
      b.classList.toggle('active', bn === n);

    var modeSel = document.getElementById('fl-mode-selector');
    if (modeSel) modeSel.style.display = (n === 1) ? 'flex' : 'none';
    closeAllModals();
    render();
  }

  var selectedDriverIdx = 0;

  function simLog(text, color){
    var d = new Date();
    var t = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');

  function renderSimStatus(){
    var p = pumps.find(function(x){ return x.id === activeTab; });
    var el = document.getElementById('fl-sim-status');
    if (!el || !p) return;

    function row(label, value, isEmpty){
      return '<div class="sim-status-row">' +
        '<span class="lbl">' + label + '</span>' +
        '<span class="val' + (isEmpty ? ' empty' : '') + '">' + value + '</span>' +
      '</div>';
    }
    el.innerHTML =
      row(t('sim.row.nozzle'),   p.nozzle === 'lifted' ? t('sim.nozzle.lifted') : t('sim.nozzle.hung'), p.nozzle === 'hung') +
      row(t('sim.row.operator'), p.driver ? p.driver.name + ' [' + p.driver.id + ']' : t('sim.notLoaded'), !p.driver) +
      row(t('sim.row.vehicle'),  p.vehicle ? p.vehicle.plate + ' [' + p.vehicle.id + ']' : t('sim.notLoaded'), !p.vehicle) +
      row(t('sim.row.flow'),     p.flow ? t('sim.activePump') + p.rate.toFixed(1) + ' L/min)' : t('sim.idle'), !p.flow);
  }

  function renderSimEvents(){
    var p = pumps.find(function(x){ return x.id === activeTab; });
    var el = document.getElementById('fl-sim-events');
    if (!el || !p) return;
    el.innerHTML = '';

    var driver = demoDrivers[selectedDriverIdx];
    var vehicle = demoVehicles[selectedVehicleIdx];

    // Určení "next" kroku - dle stavu
    var nextStep = null;
    if (p.bypass){
      nextStep = p.flow ? 'interruptOrHang' : (p.nozzle === 'lifted' ? 'startFlow' : 'lift');
    } else if (p.nozzle === 'hung' && p.status !== 'hung' && p.status !== 'saved'){
      // Klidový stav - více možností
      nextStep = 'liftOrScan';
    } else if (p.nozzle === 'lifted' && !p.driver && !p.vehicle){
      nextStep = 'scan';
    } else if (p.vehicle && p.vehicle.requiresDriver && !p.driver){
      nextStep = 'driver';
    } else if (p.vehicle && p.vehicle.requiresPin && !p.vehiclePinOk){
      nextStep = 'pin';
    } else if (p.vehicle && p.vehicle.requiresKmMth && (p.kmMth === null || p.kmMth === '')){
      nextStep = 'kmmth';
    } else if (!p.vehicle && p.driver){
      nextStep = 'vehicle';
    } else if (authorizationOk(p) && !p.flowArmed){
      nextStep = 'arm';
    } else if (p.flowArmed && !p.flow){
      nextStep = 'startFlow';
    } else if (p.flow){
      nextStep = 'interruptOrHang';
    }

    var events = [
      {
        key: 'lift', icon: '⬆', title: t('sim.ev.lift.title'),
        desc: t('sim.ev.lift.desc'),
        disabled: p.nozzle === 'lifted',
        action: function(){ hwLiftNozzle(p); }
      },
      {
        key: 'driver', icon: '🪪', title: t('sim.ev.driver.title'),
        desc: driver ? driver.name + ' · ' + driver.role + ' · PIN ' + driver.pin : t('sim.notSelected'),
        disabled: p.bypass || !!p.driver,
        action: function(){ hwScanDriver(p, driver); }
      },
      {
        key: 'vehicle', icon: '🚛', title: t('sim.ev.vehicle.title'),
        desc: vehicle ? vehicle.plate + ' (' + vehicle.label + ')' + (vehicle.requiresDriver ? ' · ' + t('sim.rule.driver') : '') + (vehicle.requiresPin ? ' · ' + t('sim.rule.pin') : '') + (vehicle.requiresKmMth ? ' · ' + t('sim.rule.kmMth') : '') : t('sim.notSelectedF'),
        disabled: p.bypass || !!p.vehicle,
        action: function(){ hwScanVehicle(p, vehicle); }
      },
      {
        key: 'arm', icon: '▶', title: t('sim.ev.arm.title'),
        desc: t('sim.ev.arm.desc'),
        disabled: p.bypass || p.flowArmed || p.flow || (p.vehicle && (
          (p.vehicle.requiresDriver && !p.driver) ||
          (p.vehicle.requiresPin && !p.vehiclePinOk) ||
          (p.vehicle.requiresKmMth && (p.kmMth === null || p.kmMth === ''))
        )) || !p.vehicle,
        action: function(){ hwArmFlow(p); },
        success: true
      },
      {
        key: 'startFlow', icon: '⛽', title: t('sim.ev.startFlow.title'),
        desc: t('sim.ev.startFlow.desc'),
        disabled: p.flow || (!p.bypass && !p.flowArmed) || p.nozzle !== 'lifted',
        action: function(){ p.liters > 0 ? hwResumeFlow(p) : hwStartFlow(p); },
        success: true
      },
      {
        key: 'remove', icon: '↗', title: t('sim.ev.remove.title'),
        desc: t('sim.ev.remove.desc'),
        disabled: !p.nozzleInserted,
        action: function(){ hwRemoveNozzle(p); }
      },
      {
        key: 'interrupt', icon: '⏸', title: t('sim.ev.interrupt.title'),
        desc: t('sim.ev.interrupt.desc'),
        disabled: !p.flow,
        action: function(){ hwInterruptFlow(p); }
      },
      {
        key: 'hang', icon: '⬇', title: t('sim.ev.hang.title'),
        desc: t('sim.ev.hang.desc'),
        disabled: p.nozzle === 'hung',
        action: function(){ hwHangNozzle(p); },
        danger: true
      }
    ];

    events.forEach(function(e){
      var btn = document.createElement('button');
      btn.className = 'sim-event-btn';
      if (e.danger) btn.className += ' danger';
      if (e.success) btn.className += ' success';
      // "next" highlight
      var isNext = false;
      if (nextStep === 'lift' && e.key === 'lift') isNext = true;
      else if (nextStep === 'liftOrScan' && (e.key === 'lift' || e.key === 'driver' || e.key === 'vehicle')) isNext = true;
      else if (nextStep === 'scan' && (e.key === 'driver' || e.key === 'vehicle')) isNext = true;
      else if (nextStep === 'driver' && e.key === 'driver') isNext = true;
      else if (nextStep === 'vehicle' && e.key === 'vehicle') isNext = true;
      else if (nextStep === 'arm' && e.key === 'arm') isNext = true;
      else if (nextStep === 'startFlow' && e.key === 'startFlow') isNext = true;
      else if (nextStep === 'interruptOrHang' && (e.key === 'interrupt' || e.key === 'hang')) isNext = true;
      if (isNext) btn.className += ' next';
      btn.disabled = e.disabled;
      var num = e.title.split('.')[0];
      var label = e.title.split('.').slice(1).join('.').trim();
      btn.innerHTML =
        '<span class="num">' + num + '</span>' +
        '<span class="icon" style="font-size:16px;">' + e.icon + '</span>' +
        '<span class="lbl"><span class="ttl">' + label + '</span><br><span class="desc">' + e.desc + '</span></span>';
      btn.onclick = function(){ if (!e.disabled) e.action(); };
      el.appendChild(btn);
    });

    // BYPASS toggle ve speciální sekci
    var bypassBtn = document.createElement('button');
    bypassBtn.className = 'sim-event-btn' + (p.bypass ? ' danger' : '');
    bypassBtn.style.marginTop = '6px';
    bypassBtn.style.borderColor = p.bypass ? '#d24f4f' : '#323232';
    bypassBtn.style.background = p.bypass ? 'rgba(212,79,79,0.15)' : '#1d2127';
    bypassBtn.innerHTML =
      '<span class="num" style="background:rgba(212,79,79,0.18);color:#ff8888;border-color:rgba(212,79,79,0.4);">⚠</span>' +
      '<span class="lbl">' +
        '<span class="ttl" style="color:' + (p.bypass ? '#ff8888' : '#ffffff') + ';">' + (p.bypass ? t('em.turnOff') : 'Zapnout BYPASS') + '</span>' +
        '<br><span class="desc">manuální tankování bez autorizace</span>' +
      '</span>';
    bypassBtn.onclick = function(){ hwToggleBypass(p); };
    el.appendChild(bypassBtn);
  }

  function renderSimActors(){
    var dEl = document.getElementById('fl-sim-drivers');
    var vEl = document.getElementById('fl-sim-vehicles');
    if (!dEl || !vEl) return;
    dEl.innerHTML = '';
    vEl.innerHTML = '';

    demoDrivers.forEach(function(d, i){
      var b = document.createElement('button');
      b.className = 'sim-actor-btn' + (i === selectedDriverIdx ? ' active' : '');
      // role barva
      var roleBg, roleFg;
      if (d.role === 'Dealer Admin'){ roleBg = 'rgba(203,96,21,0.18)'; roleFg = '#CB6015'; }
      else if (d.role === 'Admin'){    roleBg = 'rgba(212,79,79,0.18)';  roleFg = '#ff8888'; }
      else                            { roleBg = 'rgba(0,165,155,0.15)'; roleFg = '#27dbde'; }
      b.innerHTML =
        '<div class="actor-name">' + d.name + '</div>' +
        '<div class="actor-id">' + d.id + '</div>' +
        '<div style="display:flex;align-items:center;gap:4px;margin-top:3px;flex-wrap:wrap;">' +
          '<span style="background:' + roleBg + ';color:' + roleFg + ';border:1px solid ' + roleFg + '40;border-radius:3px;padding:1px 5px;font-size:8px;font-weight:700;letter-spacing:0.3px;">' + d.role.toUpperCase() + '</span>' +
          '<span style="background:#16191d;color:#808080;border:1px solid #323232;border-radius:3px;padding:1px 5px;font-size:8px;font-weight:600;font-family:Satoshi, Menlo, Monaco, Consolas, monospace;">PIN ' + d.pin + '</span>' +
        '</div>';
      b.onclick = function(){ selectedDriverIdx = i; renderSim(); };
      dEl.appendChild(b);
    });

    demoVehicles.forEach(function(v, i){
      var b = document.createElement('button');
      b.className = 'sim-actor-btn' + (i === selectedVehicleIdx ? ' active' : '');
      // sestavím chip-y pro pravidla
      var chips = [];
      if (v.requiresDriver){
        chips.push('<span style="background:rgba(203,96,21,0.15);color:#CB6015;border:1px solid rgba(203,96,21,0.4);border-radius:3px;padding:1px 5px;font-size:8px;font-weight:700;letter-spacing:0.3px;display:inline-flex;align-items:center;gap:3px;"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>ŘIDIČ</span>');
      }
      if (v.requiresPin){
        chips.push('<span style="background:rgba(212,79,79,0.15);color:#ff8888;border:1px solid rgba(212,79,79,0.4);border-radius:3px;padding:1px 5px;font-size:8px;font-weight:700;letter-spacing:0.3px;display:inline-flex;align-items:center;gap:3px;"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>PIN ' + v.pin + '</span>');
      }
      if (v.requiresKmMth){
        chips.push('<span style="background:rgba(90,168,212,0.15);color:#5aa8d4;border:1px solid rgba(90,168,212,0.4);border-radius:3px;padding:1px 5px;font-size:8px;font-weight:700;letter-spacing:0.3px;display:inline-flex;align-items:center;gap:3px;"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>km/MTH</span>');
      }
      if (chips.length === 0){
        chips.push('<span style="color:#808080;font-size:8px;font-weight:600;font-style:italic;">bez pravidel</span>');
      }
      b.innerHTML =
        '<div class="actor-name" style="font-family:Satoshi, Menlo, Monaco, Consolas, monospace;">' + v.plate + '</div>' +
        '<div class="actor-id">' + v.id + ' · ' + v.label + '</div>' +
        '<div style="display:flex;align-items:center;gap:3px;margin-top:3px;flex-wrap:wrap;">' + chips.join('') + '</div>';
      b.onclick = function(){ selectedVehicleIdx = i; renderSim(); };
      vEl.appendChild(b);
    });
  }

  function renderSimLog(){
    var el = document.getElementById('fl-sim-log');
    if (!el) return;
    if (simLogEntries.length === 0){
      el.innerHTML = '<div class="lline"><span class="ltext" style="color:#808080;font-style:italic;">žádné události zatím — klepněte na krok výše</span></div>';
      return;
    }
    el.innerHTML = simLogEntries.map(function(e){
      return '<div class="lline"><span class="ltime">' + e.time + '</span><span class="ltext ' + e.color + '">' + e.text + '</span></div>';
    }).join('');
  }

  function renderSim(){
    renderSimPumpTabs();
    renderSimStatus();
    renderSimEvents();
    renderSimActors();
    renderSimLog();
  }

  var resetBtn = document.getElementById('fl-sim-reset');
  if (resetBtn){
    resetBtn.onclick = function(){
      var p = pumps.find(function(x){ return x.id === activeTab; });
      if (p) hwReset(p);
    };
  }

  /* ==========================================================
     INIT
  ========================================================== */
  function render(){
    renderTabs(); renderDisplay(); renderActionBar();
    renderSim();
  }
  pumps.forEach(function(p){ if (p.flow) startTicker(p); });
  updateStaticTexts();
  render();

    close.style.cssText = 'position:absolute;top:14px;right:14px;width:48px;height:48px;border-radius:50%;background:rgba(15,16,18,0.85);border:1.5px solid #323232;color:#e0ed07;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;';
    close.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M18 6L6 18M6 6l12 12"/></svg>';
    var prev = document.createElement('button');
    prev.style.cssText = 'position:absolute;bottom:16px;left:16px;height:52px;padding:0 20px;border-radius:26px;background:rgba(15,16,18,0.85);border:1.5px solid #323232;color:#ffffff;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;';
    prev.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M15 6l-6 6 6 6"/></svg><span>ZPĚT</span>';
    var next = document.createElement('button');
    next.style.cssText = 'position:absolute;bottom:16px;right:16px;height:52px;padding:0 22px;border-radius:26px;background:#e0ed07;border:none;color:#000000;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;';
    next.innerHTML = '<span>DALŠÍ</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M9 6l6 6-6 6"/></svg>';
    var ind = document.createElement('div');
    ind.style.cssText = 'position:absolute;bottom:32px;left:0;right:0;text-align:center;color:#ffffff;font-family:Satoshi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:14px;font-weight:700;pointer-events:none;text-shadow:0 1px 4px #000;';
    function done(){ if (ov.parentNode) ov.parentNode.removeChild(ov); }
    function upd(){
      ov.style.backgroundImage = 'url(' + pages[idx] + ')';
      prev.style.display = idx > 0 ? 'flex' : 'none';
      next.querySelector('span').textContent = (idx < pages.length - 1) ? 'DALŠÍ' : 'HOTOVO';
      ind.textContent = (idx + 1) + ' / ' + pages.length;
    }
    close.onclick = done;
    prev.onclick = function(){ if (idx > 0){ idx--; upd(); } };
    next.onclick = function(){ if (idx < pages.length - 1){ idx++; upd(); } else done(); };
    ov.appendChild(close); ov.appendChild(prev); ov.appendChild(next); ov.appendChild(ind);
    rootEl.appendChild(ov);
    upd();
  }
  window.flHelp = openHelp;

  (function setupScreensaver(){
    var IDLE_MS = 45000;
    var saver = document.createElement('div');
    saver.id = 'fl-saver';
    saver.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;z-index:9000;display:none;background-color:#000;background-position:center;background-size:cover;background-repeat:no-repeat;';
    rootEl.appendChild(saver);
    function busy(){
      if (modalStack.length > 0) return true;
      for (var i = 0; i < pumps.length; i++){ if (pumps[i].flow || pumps[i].status === 'fueling') return true; }
      return false;
    }
    function show(){ if (saver.style.display !== 'none') return; if (busy()) return; saver.style.backgroundImage = 'url(' + FL_IMG.s07 + ')'; saver.style.display = 'block'; }
    function hide(){ if (saver.style.display === 'none') return; saver.style.display = 'none'; saver.style.backgroundImage = 'none'; }
    var timer = null;
    function arm(){ clearTimeout(timer); timer = setTimeout(maybeShow, IDLE_MS); }
    function maybeShow(){ if (busy()){ arm(); return; } show(); }
    function reset(){ if (saver.style.display !== 'none') hide(); arm(); }
    function dismiss(e){ if (saver.style.display === 'none') return; if (e){ e.preventDefault && e.preventDefault(); e.stopPropagation && e.stopPropagation(); } hide(); arm(); }
    saver.addEventListener('touchstart', dismiss, { passive: false });
    saver.addEventListener('mousedown', dismiss, false);
    document.addEventListener('touchstart', function(){ reset(); }, { passive: true, capture: true });
    document.addEventListener('mousedown', function(){ reset(); }, true);
    document.addEventListener('keydown', function(){ reset(); }, true);
    arm();
    window.flScreensaver = { show: show, hide: hide, reset: reset };
  })();

  /* Re-fit při resize */
  window.addEventListener('resize', function(){ requestAnimationFrame(autoFitNumbers); });
})();
</script>
