<title>Fluenix Contact Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --chrome:#1E1F21; --chrome-2:#2A2B2E; --chrome-3:#3A3B3F;
  --txt:#E8E9EB; --txt-2:#A2A6AB; --accent:#4F8CFF; --teal:#00A896;
  --canvas:#141517;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--txt);font-family:Figtree,system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;overflow:hidden}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:18px;height:52px;padding:0 16px;background:var(--chrome);border-bottom:1px solid #000;flex:none}
.brand{font-weight:700;font-size:14px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--txt-2)}
.bps{display:flex;gap:2px;background:var(--chrome-2);padding:3px;border-radius:7px;margin:0 auto}
.bp{display:flex;align-items:center;gap:7px;height:32px;padding:0 11px;border:0;border-radius:5px;background:transparent;color:var(--txt-2);font:600 12.5px Figtree,sans-serif;cursor:pointer;white-space:nowrap}
.bp svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bp:hover{color:var(--txt);background:var(--chrome-3)}
.bp[aria-pressed="true"]{background:var(--accent);color:#fff}
.bp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bp .w{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;opacity:.75}
.readout{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--txt-2);white-space:nowrap}
.readout b{font-family:"JetBrains Mono",ui-monospace,monospace;color:var(--txt);font-weight:500;font-size:13px;min-width:62px;text-align:right}
.readout .zone{padding:3px 9px;border-radius:999px;background:rgba(0,168,150,.18);color:#5FD8C6;font-weight:600;font-size:11.5px}
.readout input{width:64px;height:28px;border-radius:5px;border:1px solid var(--chrome-3);background:var(--chrome-2);color:var(--txt);font:500 12.5px "JetBrains Mono",monospace;padding:0 8px}

/* ---------- ruler ---------- */
.ruler{height:22px;background:var(--chrome);border-bottom:1px solid #000;position:relative;flex:none;overflow:hidden}
.ruler .tick{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,.14);font:500 10px "JetBrains Mono",monospace;color:var(--txt-2);padding:4px 0 0 5px;white-space:nowrap}
.ruler .tick.on{border-left-color:var(--accent);color:#9DBEFF}

/* ---------- canvas ---------- */
.stage{flex:1;overflow:auto;display:flex;justify-content:center;padding:24px 28px 40px;position:relative}
.device{position:relative;flex:none;height:100%;min-height:500px;transition:width .22s ease}
.device.dragging{transition:none}
.device iframe{width:100%;height:100%;border:0;background:#fff;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 20px 50px -20px rgba(0,0,0,.8);display:block}
.device.dragging iframe{pointer-events:none}
.handle{position:absolute;top:50%;right:-18px;transform:translateY(-50%);width:12px;height:64px;border-radius:6px;background:var(--chrome-3);cursor:ew-resize;display:grid;place-items:center;border:1px solid #555}
.handle::before{content:"";width:2px;height:26px;border-left:2px solid #8B8F95;border-right:2px solid #8B8F95;width:6px}
.handle:hover,.device.dragging .handle{background:var(--accent);border-color:var(--accent)}
.handle:hover::before,.device.dragging .handle::before{border-color:#fff}
.hint{position:absolute;left:28px;bottom:12px;font-size:12px;color:var(--txt-2)}

@media (max-width:980px){ .bp .lbl{display:none} }
@media (prefers-reduced-motion:reduce){ .device{transition:none} }
</style>

<div class="top">
  <div class="brand">Contact page<small>Fluenix · breakpoint playground</small></div>
  <div class="bps" role="group" aria-label="Breakpoints">
    <button class="bp" data-w="1280" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg><span class="lbl">Desktop</span><span class="w">1280</span></button>
    <button class="bp" data-w="991"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="13" rx="1.5"/><path d="M1 20h22"/></svg><span class="lbl">Tablet</span><span class="w">991</span></button>
    <button class="bp" data-w="767"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="11" rx="1.5"/></svg><span class="lbl">Mobile landscape</span><span class="w">767</span></button>
    <button class="bp" data-w="375"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="1.8"/><path d="M11 18h2"/></svg><span class="lbl">Mobile portrait</span><span class="w">375</span></button>
  </div>
  <div class="readout">
    <span class="zone" id="zone">Desktop</span>
    <b id="wout">1280 px</b>
    <input id="win" type="number" min="320" max="1600" step="1" value="1280" aria-label="Width in pixels">
  </div>
</div>
<div class="ruler" id="ruler"></div>

<div class="stage" id="stage">
  <div class="device" id="device">
    <iframe id="view" title="Contact page preview"></iframe>
    <div class="handle" id="handle" role="slider" aria-label="Drag to resize" tabindex="0"></div>
  </div>
  <div class="hint">Drag the handle on the right edge, or type a width. Arrow keys on the handle nudge by 10 px.</div>
</div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#2B2D2F; --ink-2:#55595C; --ink-3:#8A8F92;
  --teal:#00A896; --teal-d:#007F71; --teal-wash:#E8F5F3;
  --peach:#FCEBE3; --orange:#CB6015;
  --line:#DCE9E6; --page:#F3F6F5; --bar:#1E2422;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Figtree,system-ui,-apple-system,Segoe UI,sans-serif}

/* ---------- top bar ---------- */
.bar{background:var(--bar);color:#EAEFED;padding:20px 24px}
.bar-in{max-width:1180px;margin:0 auto}
.bar h1{font-size:19px;font-weight:700;margin:0 0 6px}
.bar p{font-size:14px;margin:0;color:#A9B4B1;max-width:84ch;line-height:1.55}
.bar a.back{color:#7FE0D2;text-decoration:none;font-size:13px;font-weight:600;display:inline-block;margin-bottom:10px}

/* ---------- site replica ---------- */
.frame{max-width:1180px;margin:40px auto 14px;border-radius:10px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 12px 32px -18px rgba(0,60,50,.25);background:#fff}
.section{background:linear-gradient(180deg,#FFFFFF 0%,#E8F5F3 100%);padding:64px 40px 72px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;align-items:start}
.col{display:flex;flex-direction:column;align-items:stretch}

.card{text-align:center;display:flex;flex-direction:column;align-items:center}
.icon{width:80px;height:80px;border-radius:14px;background:var(--peach);display:grid;place-items:center;margin-bottom:24px}
.icon svg{width:44px;height:44px;stroke:var(--orange);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:30px;font-weight:700;margin:0 0 16px;letter-spacing:-.01em}
.card .desc{font-size:15px;color:var(--ink-2);margin:0 0 22px}
.line{display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:12px}
.line svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.line a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* ---------- people column ---------- */
.people{margin-top:28px;display:grid;gap:16px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:24px 18px 20px;text-align:center;background:#fff;display:flex;flex-direction:column;align-items:center;transition:border-color .15s,box-shadow .15s}
.tcard:hover{border-color:#9FCFC7;box-shadow:0 8px 20px -14px rgba(0,90,80,.45)}
.av{width:84px;height:84px;border-radius:50%;background:#D5ECE8;color:var(--teal-d);display:grid;place-items:center;font-weight:700;font-size:24px;overflow:hidden;text-decoration:none;margin:0 0 14px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
a.p-name{font-weight:700;font-size:16.5px;line-height:1.25;color:var(--ink);text-decoration:none}
a.p-name:hover{color:var(--teal-d)}
.p-role{font-size:13.5px;color:var(--ink-3);margin:4px 0 14px;line-height:1.35}
a.p-tel,span.p-tel{font-size:14.5px;color:var(--teal-d);font-weight:600;font-variant-numeric:tabular-nums;text-decoration:none;margin-bottom:8px}
a.p-mail{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--teal-d);text-decoration:none}
a.p-mail svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a.p-tel:hover,a.p-mail:hover{text-decoration:underline;text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
.p-tel.ghost{visibility:hidden}

/* ---------- notes ---------- */
.box{max-width:1132px;margin:36px auto 60px;border-radius:10px;padding:18px 22px;font-size:14.5px;line-height:1.7;background:var(--teal-wash);border:1px solid #BFE3DD}
.box h5{margin:0 0 8px;font-size:15px;color:var(--teal-d)}
.box ul{margin:0;padding-left:20px}
.box li{margin-bottom:5px}
code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:rgba(0,0,0,.05);padding:1px 5px;border-radius:3px}

/* ---------- Webflow breakpoints ---------- */
.col,.people,.tcard{min-width:0}
/* Tablet: 991px and below */
@media (max-width:991px){
  .cols{grid-template-columns:repeat(2,1fr);gap:40px 28px}
  .section{padding:56px 28px 64px}
  .card h3{font-size:26px}
}
/* Mobile landscape: 767px and below  compact rows */
@media (max-width:767px){
  .frame{margin:24px 12px 14px}
  .cols{grid-template-columns:1fr;gap:48px}
  .section{padding:44px 18px 52px}
  .people{margin-top:20px;gap:10px}
  .tcard{display:grid;grid-template-columns:52px 1fr;column-gap:14px;row-gap:1px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px}
  .tcard .av{grid-row:1 / span 4;width:52px;height:52px;font-size:15px;margin:0}
  a.p-name{font-size:15.5px}
  .p-role{font-size:13px;margin:0 0 3px}
  a.p-tel,span.p-tel{font-size:14px;margin:0}
  .p-tel.ghost{display:none}
  a.p-mail{font-size:12.5px;margin-top:2px}
}
/* Mobile portrait: 478px and below */
@media (max-width:478px){
  .section{padding:36px 14px 44px}
  .card h3{font-size:24px}
  .card .desc{font-size:14px}
}
</style>

  <h5>How the links work — and why</h5>
  <ul>
    <li><b>Phone numbers dial directly.</b> On a customer's mobile, one tap on a number starts the call. Existing customers can still reach the person they know.</li>
    <li><b>Email always goes to the team, not the person.</b> Clicking a name, photo or email link opens a message to the team inbox the person belongs to — Gali and Jiří → <code>sales@fluenix.eu</code>, Krzysztof and Lucie → <code>support@fluenix.eu</code>, Lenka and Ligia → <code>accounting@fluenix.eu</code>. Each team inbox forwards to exactly the people shown.</li>
    <li><b>Nothing gets lost.</b> Every enquiry lands in one ordered place and reaches everyone on the team, so it is answered even when one person is travelling or on leave.</li>
    <li><b>Enquiries can be counted.</b> Because all email arrives through the three team inboxes, we can count enquiries per department, per week, and compare before and after the rebrand.</li>

<script>
(function(){
  var view=document.getElementById('view'), device=document.getElementById('device'),
      handle=document.getElementById('handle'), stage=document.getElementById('stage'),
      wout=document.getElementById('wout'), win=document.getElementById('win'),
      zone=document.getElementById('zone'), ruler=document.getElementById('ruler'),
      bps=[].slice.call(document.querySelectorAll('.bp'));

  var extra='<style>.bar,.box{display:none!important}.frame{margin:0 auto!important;border-radius:0!important;box-shadow:none!important;max-width:none!important}body{background:#fff!important}</style>';
  view.srcdoc=document.getElementById('page').textContent+extra;

  var MIN=320, MAX=1600, width=1280;
  function zoneFor(w){ return w<=478?'Mobile portrait':w<=767?'Mobile landscape':w<=991?'Tablet':'Desktop'; }
  function drawRuler(){
    var marks=[{w:478,t:'478'},{w:767,t:'767'},{w:991,t:'991'},{w:1280,t:'1280'}];
    var sw=stage.clientWidth, left=(sw-width)/2;
    ruler.innerHTML='';
    marks.forEach(function(m){
      if(m.w>width) return;
      var d=document.createElement('div'); d.className='tick'+(m.w===width?' on':'');
      d.style.left=(left+m.w)+'px'; d.textContent=m.t; ruler.appendChild(d);
    });
  }
  function set(w, fromInput){
    width=Math.max(MIN,Math.min(MAX,Math.round(w)));
    device.style.width=width+'px';
    wout.textContent=width+' px';
    if(!fromInput) win.value=width;
    var z=zoneFor(width); zone.textContent=z;
    bps.forEach(function(b){ b.setAttribute('aria-pressed', String(zoneFor(+b.dataset.w)===z)); });
    handle.setAttribute('aria-valuenow',width);
    drawRuler();
    try{ localStorage.setItem('fx-contact-width',width); }catch(e){}
  }
  bps.forEach(function(b){ b.addEventListener('click',function(){ set(+b.dataset.w); }); });
  win.addEventListener('input',function(){ if(win.value) set(+win.value,true); });

  var startX=0,startW=0;
  handle.addEventListener('pointerdown',function(e){
    startX=e.clientX; startW=width; device.classList.add('dragging');
    handle.setPointerCapture(e.pointerId); e.preventDefault();
  });
  handle.addEventListener('pointermove',function(e){
    if(!device.classList.contains('dragging')) return;
    set(startW+(e.clientX-startX)*2);   // device is centred, so the edge moves at half speed
  });
  function end(){ device.classList.remove('dragging'); }
  handle.addEventListener('pointerup',end); handle.addEventListener('pointercancel',end);
  handle.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){ set(width+10); e.preventDefault(); }
    if(e.key==='ArrowLeft'){ set(width-10); e.preventDefault(); }
  });
  window.addEventListener('resize',drawRuler);

  var saved=1280; try{ saved=+localStorage.getItem('fx-contact-width')||1280; }catch(e){}
  set(saved);
})();
</script>
